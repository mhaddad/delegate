<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delegate · Protocolo de Integração Agêntica MCP</title>

    <!-- Favicon e Ícones do Delegate -->
    <link rel="shortcut icon" href="/assets/delegate-symbol.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/delegate-symbol.png" />

    <!-- Tipografia partilhada com os ecrãs da Câmara (Barlow + JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Paleta Delegate — derivada do símbolo oficial (assets/delegate-symbol.png).
           Navy #121b2c, verde Delegate #70bb86, tinta #e9edf2. Não são tokens
           de biblioteca: são as cores medidas no activo da marca. */
        --del-fundo-obs: #0a0f18;
        --del-fundo: #0d131e;
        --del-cartao: rgba(18, 27, 44, 0.75);
        --del-cartao-destaque: rgba(24, 35, 55, 0.85);
        --del-borda: rgba(233, 237, 242, 0.10);
        --del-borda-brilhante: rgba(112, 187, 134, 0.40);

        /* Verde Delegate como acento único. Os estados semânticos derivam dele
           por luminosidade e saturação, não de outra paleta de biblioteca. */
        --del-acento: #70bb86;
        --del-acento-forte: #8ccfa0;
        --del-acento-escuro: #4f8f63;
        --del-acento-veu: rgba(112, 187, 134, 0.14);

        /* Estados: derivam do acento, não de uma escala arco-íris. */
        --del-espera: #c9a227;   /* D0–D1 · ainda não actua */
        --del-aviso: #d98c3f;    /* D2 · prepara */
        --del-ativa: #70bb86;    /* D3–D4 · mandato activo */
        --del-erro: #c25b52;     /* revogado / falhado */

        --del-texto: #e9edf2;
        --del-texto-secundario: #9aa8b8;
        --del-texto-suave: #66748a;

        --font-primary: 'Barlow', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-condensed: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: var(--del-fundo-obs);
        color: var(--del-texto);
        font-family: var(--font-primary);
        font-size: 13.5px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      /* 1. CABEÇALHO DELEGA */
      header.del-header {
        background: rgba(10, 15, 24, 0.92);
        border-bottom: 1px solid var(--del-borda);
        padding: 0.75rem 2rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-conteudo {
        max-width: 1760px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .logo-area {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .logo-delegate-header {
        height: 38px;
        width: auto;
        display: block;
      }

      .tag-intermediario {
        background: var(--del-acento-veu);
        border: 1px solid rgba(112, 187, 134, 0.40);
        color: var(--del-acento-forte);
        padding: 3px 10px;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      /* Ícones: um único traço, herdam currentColor. Substituem os emojis,
         que traziam o seu próprio glossótipo e eram lidos em voz alta. */
      .ico {
        width: 1em;
        height: 1em;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: -0.125em;
      }
      .ico-lista { display: inline-flex; align-items: center; gap: 0.5rem; }

      .header-nav {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .nav-link {
        color: var(--del-texto-secundario);
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 600;
        padding: 0.45rem 0.9rem;
        border-radius: 6px;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        border: 1px solid transparent;
      }

      .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.05);
      }

      .nav-link.ativo {
        color: #ffffff;
        background: var(--del-acento-veu);
        border: 1px solid rgba(112, 187, 134, 0.45);
      }

      .nav-link.externo {
        color: #8ccfa0;
        border: 1px solid rgba(112, 187, 134, 0.20);
        background: rgba(112, 187, 134, 0.05);
      }
      .nav-link.externo:hover {
        background: rgba(112, 187, 134, 0.15);
      }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(112, 187, 134, 0.10);
        border: 1px solid rgba(112, 187, 134, 0.32);
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: #8ccfa0;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--del-acento);
        animation: pulso 2s infinite;
      }

      @keyframes pulso {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.15); }
      }

      .divisor-vertical-del {
        height: 22px;
        width: 1px;
        background: rgba(255, 255, 255, 0.15);
        margin: 0 0.5rem;
      }

      .etiqueta-lado-camara {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--del-texto-suave);
        margin-right: 0.25rem;
      }

      .faixa-separacao-sistema {
        background: rgba(10, 15, 24, 0.96);
        border-bottom: 1px solid rgba(112, 187, 134, 0.28);
        padding: 0.65rem 1.75rem;
      }

      .separacao-conteudo {
        max-width: 1720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .pill-distincao-sistema {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: transparent;
        border: none;
        color: var(--del-acento-forte);
        font-size: 11.5px;
        font-weight: 700;
        padding: 0.3rem 0;
        white-space: nowrap;
      }

      .separacao-texto {
        font-size: 12.5px;
        color: #cbd5e1;
        line-height: 1.4;
      }

      .separacao-texto strong {
        color: var(--del-texto);
      }

      /* Links dentro da frase: alvo de toque sem partir o ritmo da linha. */
      .separacao-texto a {
        display: inline-block;
        padding: 0.85rem 0;
        color: var(--del-acento-forte);
        text-decoration: underline;
      }
      .separacao-texto a:focus-visible {
        outline: 2px solid var(--del-acento-forte);
        outline-offset: 2px;
      }

      /* 2. LAYOUT PRINCIPAL */
      main.del-corpo {
        max-width: 1760px;
        margin: 0 auto;
        padding: 1.5rem 2rem 3rem;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        flex: 1;
      }

      /* 3. ARQUITETURA DE INTEGRAÇÃO (3 CAMADAS)

         Não são três caixas paralelas: são três momentos de um percurso. O
         desenho é uma linha de fluxo — o cidadão à esquerda, o Delegate ao
         centro, a Câmara à direita — e o que liga é o assunto da secção.
         Um primitivo só, repetido, em vez de três cards iguais. */
      .triptico-container {
        display: grid;
        grid-template-columns: 1fr 1.4fr 1fr;
        gap: 0;
        border: 1px solid var(--del-borda);
        border-radius: 4px;
        overflow: hidden;
      }

      .mundo-card {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 1.35rem 1.5rem 1.5rem;
        position: relative;
      }

      /* A camada do centro é o eixo do percurso: mais peso, sem caixa. */
      .mundo-card.intermediario {
        background: rgba(112, 187, 134, 0.06);
        border-left: 1px solid var(--del-borda);
        border-right: 1px solid var(--del-borda);
      }

      /* A marca de cada momento é um peso tipográfico, não uma risca colorida. */
      .mundo-card .numero-camada {
        font-family: var(--font-condensed);
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.01em;
        display: block;
        margin-bottom: 0.5rem;
      }
      .mundo-card.municipe .numero-camada { color: var(--del-texto-suave); }
      .mundo-card.intermediario .numero-camada { color: var(--del-acento); }
      .mundo-card.camara .numero-camada { color: var(--del-espera); }

      .mundo-topo {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .mundo-titulo {
        font-size: 13.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .badge-mundo {
        font-size: 10.5px;
        font-weight: 500;
        color: var(--del-texto-suave);
      }

      .lista-itens {
        display: flex;
        flex-direction: column;
      }

      .item-camada {
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--del-borda);
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .item-camada:last-child { border-bottom: none; padding-bottom: 0; }

      .item-cabecalho {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .item-nome {
        font-size: 12px;
        font-weight: 600;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .item-sub {
        font-size: 11px;
        color: var(--del-texto-secundario);
      }

      /* 4. RADAR EM TEMPO REAL: EVENTOS & MANDATO INFERIDO */
      .radar-seccao {
        background: var(--del-cartao-destaque);
        border: 1px solid var(--del-borda-brilhante);
        border-radius: 12px;
        padding: 1.25rem 1.6rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        box-shadow: 0 4px 35px rgba(0, 0, 0, 0.4);
      }

      .radar-top-row {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 1.5rem;
        align-items: center;
      }

      .radar-atividade-box {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
      }

      .radar-icone-pulsar {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--del-acento-veu);
        border: 1px solid rgba(112, 187, 134, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }

      .radar-texto h2 {
        font-size: 14.5px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.2rem;
      }

      .radar-texto p {
        font-size: 12px;
        color: var(--del-texto-secundario);
        line-height: 1.45;
      }

      /* Matriz de Mandato D0-D4 */
      .mandatos-matriz {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.45rem;
      }

      /* D0 a D4 é uma escada, não cinco cápsulas iguais: o que está activo
         tem presença, o resto é texto. */
      .mandato-pill {
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        padding: 0.4rem 0.25rem 0.35rem;
        text-align: center;
        transition: border-color 0.25s ease;
      }
      .mandato-pill.ativo { border-bottom-color: var(--del-acento); }

      .mandato-pill .sigla {
        font-size: 13px;
        font-weight: 800;
        font-family: var(--font-mono);
        color: var(--del-texto-suave);
        display: block;
      }

      .mandato-pill .nome {
        font-size: 10px;
        color: var(--del-texto-secundario);
        display: block;
        margin-top: 1px;
      }

      .mandato-pill.ativo .sigla {
        color: var(--del-acento-forte);
      }

      .mandato-pill.ativo .nome {
        color: var(--del-acento-forte);
        font-weight: 700;
      }

      /* 5. GRELHA DE TRABALHO: CAPACIDADES MCP & CONSOLA INTERATIVA */
      .grelha-principal {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 1.25rem;
      }

      .painel-box {
        background: var(--del-cartao);
        border: 1px solid var(--del-borda);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .painel-cabecalho {
        padding: 0.9rem 1.25rem;
        border-bottom: 1px solid var(--del-borda);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.02);
      }

      .painel-cabecalho h3 {
        font-size: 13.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      /* Lista de Ferramentas MCP */
      .ferramentas-lista {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.25rem;
        max-height: 520px;
        overflow-y: auto;
      }

      .ferramenta-card {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--del-borda);
        border-left: 2px solid transparent;
        border-radius: 0;
        padding: 0.8rem 0.9rem;
        transition: background 0.2s ease, border-color 0.2s ease;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .ferramenta-card:hover {
        background: rgba(112, 187, 134, 0.06);
        border-color: rgba(112, 187, 134, 0.32);
      }

      .ferramenta-card.selecionada {
        background: rgba(112, 187, 134, 0.07);
        border-left-color: var(--del-acento);
      }

      .ferramenta-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ferramenta-nome {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
      }

      .ferramenta-desc {
        font-size: 12px;
        color: var(--del-texto-secundario);
      }

      /* O nível de requisito é uma palavra, não uma cápsula. A caixa
         acrescentava um nível de contentor sem acrescentar informação. */
      .badge-requisito {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .badge-publico { color: var(--del-acento-forte); }
      .badge-mandato-d2 { color: var(--del-acento-forte); }
      .badge-mandato-d3 { color: var(--del-espera); }

      /* Playground MCP */
      .playground-corpo {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .cliente-selector {
        display: flex;
        gap: 0.6rem;
      }

      .cliente-btn {
        flex: 1;
        padding: 0.55rem 0.8rem;
        border-radius: 6px;
        border: 1px solid var(--del-borda);
        background: rgba(255, 255, 255, 0.02);
        color: var(--del-texto-secundario);
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        transition: all 0.2s ease;
      }

      .cliente-btn.ativo {
        background: rgba(112, 187, 134, 0.20);
        border-color: rgba(112, 187, 134, 0.52);
        color: #ffffff;
      }

      textarea.payload-box {
        width: 100%;
        height: 140px;
        background: #080a10;
        border: 1px solid var(--del-borda);
        border-radius: 8px;
        color: #8ccfa0;
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 0.75rem;
        resize: vertical;
      }

      button.btn-executar {
        background: var(--del-acento);
        color: #06120b;
        border: none;
        padding: 0.75rem 1.2rem;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      }

      button.btn-executar:hover {
        background: var(--del-acento-forte);
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }

      pre.resposta-box {
        background: #080a10;
        border: 1px solid var(--del-borda);
        border-radius: 8px;
        padding: 0.85rem;
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: #a7f3d0;
        max-height: 180px;
        overflow-y: auto;
      }

      /* 6. TABELA DE AUDITORIA SSE */
      .tabela-auditoria {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .tabela-auditoria th {
        background: rgba(255, 255, 255, 0.03);
        border-bottom: 1px solid var(--del-borda);
        padding: 0.65rem 1rem;
        text-align: left;
        font-weight: 700;
        color: var(--del-texto-secundario);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .tabela-auditoria td {
        padding: 0.65rem 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        color: var(--del-texto);
      }

      .tabela-auditoria tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }

      .hash-mono {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--del-texto-suave);
      }

      /* Seta de saída: comunica que o link sai do sistema Delegate para a Câmara.
         aria-hidden — o nome acessível está no aria-label do link. */
      .ico-saida { font-size: 0.9em; opacity: 0.65; }

      /* Visibilidade de foco: teclado tem de ver onde está. */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--del-acento-forte);
        outline-offset: 2px;
        border-radius: 3px;
      }

      /* Alvos de toque: mínimo ~44px, para uso com telemóvel na mão. */
      .nav-link { min-height: 44px; }
      .nav-link > span { display: inline-flex; align-items: center; }
      .cliente-btn { min-height: 44px; }
      button.btn-executar { min-height: 44px; }

      /* Movimento reduzido: o pulso do indicador de servidor vivo deixa de
         pulsar, mas o estado continua legível pela cor e pelo texto. */
      @media (prefers-reduced-motion: reduce) {
        .status-dot { animation: none; }
        * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }

      /* ---- Responsivo ----
         O ecrã é composto para projeção, mas transbordava na horizontal em
         ecrãs estreitos: a navegação e o tríptico têm largura fixa. Aqui a
         largura deixa de ser imposta e passa a ser derivada do espaço. */

      @media (max-width: 1100px) {
        .triptico-container { grid-template-columns: 1fr; }
      }

      @media (max-width: 900px) {
        header.del-header { padding: 0.75rem 1.25rem; }
        .header-conteudo { flex-wrap: wrap; gap: 0.75rem; }
        .header-nav { flex-wrap: wrap; gap: 0.35rem; min-width: 0; }
        .logo-area { min-width: 0; flex-wrap: wrap; }
        .nav-link { min-height: 44px; padding: 0.5rem 0.75rem; }
        .divisor-vertical-del { display: none; }
        main.del-corpo { padding: 1rem 1.25rem 2.5rem; }
        .faixa-separacao-sistema { padding: 0.75rem 1.25rem; }
      }

      @media (max-width: 640px) {
        body { font-size: 13px; }
        .logo-delegate-header { height: 30px; }
        .header-conteudo { flex-direction: column; align-items: flex-start; }
        .header-nav { flex-direction: column; align-items: stretch; width: 100%; }
        .nav-link { width: 100%; justify-content: flex-start; }
        .etiqueta-lado-camara { margin: 0.5rem 0 0.25rem; }
        main.del-corpo { padding: 0.875rem 1rem 2rem; gap: 1rem; }
        .mundo-card { padding: 1rem; }
        .radar-top-row { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
        pre.resposta-box { font-size: 11px; }
        /* Tabelas de dados: scroll controlado em vez de transbordo da página. */
        .tabela-auditoria { display: block; overflow-x: auto; white-space: nowrap; }
      }
    </style>
  </head>
  <body>

    <!-- Conjunto de ícones da Plataforma: um traço, sem preenchimento, herdando
         currentColor. Substituem os emojis, que traziam glossótipo próprio
         (inadequado a uma instituição autárquica), variavam entre sistemas

      import htm from 'https://esm.sh/htm@3.1.1';

      const html = htm.bind(h);

      const ico = (nome, tam = '1em') =>

      const FERRAMENTAS_MCP = [

        {
          nome: 'obter_servico',
          tipo: 'LEITURA',
          requisito: 'Livre (Público)',
          badgeCls: 'badge-publico',
          descricao: 'Devolve a ficha completa do procedimento municipal, enquadramento normativo, versão e fontes verificadas.',
          payloadExemplo: { id: 'ocupacao-espaco-publico-esplanada' }

        {
          nome: 'calcular_taxa_esplanada',
          tipo: 'SIMULAÇÃO',
          requisito: 'Livre (Público)',
          badgeCls: 'badge-publico',
          descricao: 'Cálculo de taxas de ocupação segundo a Tabela de Taxas e Licenças (RTTL 2025).',

          requisito: 'Livre (Público)',
          badgeCls: 'badge-publico',
          descricao: 'Verificação regulamentar de calçada (corredor de peões >= 2,00m livres segundo o Regulamento).',

        {
          nome: 'criar_rascunho_ocupacao',
          tipo: 'AÇÃO SEGURA',
          requisito: 'Mandato D2 (Preparar)',
          badgeCls: 'badge-mandato-d2',
          descricao: 'Cria um rascunho instrutório de comunicação prévia. Rejeita imediatamente sem mandato D2.',
          payloadExemplo: {
            mandato: 'MAN-2026-0001',

        {
          nome: 'submeter_comunicacao_previa',
          tipo: 'AÇÃO VINCULATIVA',
          requisito: 'Mandato D3 + Assinatura CMD',
          badgeCls: 'badge-mandato-d3',
          descricao: 'Submete formalmente a comunicação prévia à Câmara. Exige mandato D3 e token de autorização do cidadão.',
          payloadExemplo: {
            mandato: 'MAN-2026-0001',
            token_confirmacao: 'cmd-token-valido-123',
            rascunho_id: 'RASC-OEP-0001',
            cliente: 'henriques'
          }
        },
        {
          nome: 'obter_referencia_pagamento',
          tipo: 'LIQUIDAÇÃO',
          requisito: 'Mandato D2+ (Liquidar)',
          badgeCls: 'badge-mandato-d2',
          descricao: 'Emite referência Multibanco para liquidação das taxas regulamentares municipais.',

            processo: 'OEP/2026/0001',
            mandato: 'MAN-2026-0001',
            cliente: 'henriques'
          }
        }
      ];

      function App() {
        const [eventos, setEventos] = useState([]);
        const [ultimoEvento, setUltimoEvento] = useState(null);
        const [ferramentaAtiva, setFerramentaAtiva] = useState(FERRAMENTAS_MCP[0]);
        const [clienteId, setClienteId] = useState('henriques');
        const [payloadJson, setPayloadJson] = useState(JSON.stringify(FERRAMENTAS_MCP[0].payloadExemplo, null, 2));
        const [resposta, setResposta] = useState(null);
        const [executando, setExecutando] = useState(false);
        const [mandatoAtivo, setMandatoAtivo] = useState({ nivel: 'D0', id: 'MAN-D0-LIVRE', objeto: 'Consulta Pública' });

        // Conexão Server-Sent Events ao barramento
        useEffect(() => {
          let es;
          try {
            es = new EventSource('/eventos/stream');
            es.onmessage = (e) => {
              try {
                const ev = JSON.parse(e.data);
                setUltimoEvento(ev);
                setEventos((prev) => [ev, ...prev].slice(0, 30));

                if (ev.tipo === 'henriques.intencao.classificada' && ev.dados?.mandato_inferido) {
                  setMandatoAtivo({
                    nivel: ev.dados.mandato_inferido,
                    id: ev.dados.motor === 'typesafe-jev' ? 'MAN-JEV-INFERIDO' : 'MAN-2026-0001',
                    objeto: ev.dados.intencao || 'Ocupação de Espaço Público'
                  });
                }
                if (ev.tipo === 'mandato.concedido') {
                  setMandatoAtivo({
                    nivel: ev.dados?.nivel || 'D3',
                    id: ev.dados?.id || 'MAN-2026-0001',
                    objeto: ev.dados?.objeto || 'Casa Joaquim'
                  });
                }
              } catch (_) {}
            };
          } catch (_) {}
          return () => es?.close();
        }, []);

        const atividadeAgente = useMemo(() => {
          if (!ultimoEvento) {
            return {
              titulo: 'Intermediário em Escuta Contínua',
              descricao: 'A monitorizar a fronteira de comunicação entre cidadãos (Henriques/Telegram) e os serviços municipais da autarquia.',
              origem: 'delegate:idle'
            };
          }
          const t = ultimoEvento.tipo;
          if (t === 'canal.mensagem.recebida') {
            return {
              titulo: 'Cidadão contactou o Henriques no Telegram',
              descricao: `Mensagem: «${ultimoEvento.dados?.texto || '...'}». Henriques ativa o motor de inferência TypeSafe Jev.`,
              origem: 'telegram:cidadao'
            };
          }
          if (t === 'henriques.intencao.classificada') {
            const isJev = ultimoEvento.dados?.motor === 'typesafe-jev';
            return {
              titulo: isJev ? 'TypeSafe Jev inferiu Intenção e Mandato em Tempo Real' : 'Henriques classificou a intenção do cidadão',
              descricao: `Procedimento: ${ultimoEvento.dados?.intencao} · Mandato: ${ultimoEvento.dados?.mandato_inferido || 'D0'} · Confiança: ${Math.round((ultimoEvento.dados?.confianca || 1)*100)}% (${ultimoEvento.dados?.tempo_ms || 250}ms).`,
              origem: 'typesafe:jev'
            };
          }
          if (t === 'porta.servicos.procurados' || t === 'porta.servico.obtido') {
            return {
              titulo: 'Barramento MCP v2 consultado (:4001)',
              descricao: `Ficha oficial solicitada à autarquia com neutralidade e minimização de dados. Versão ${ultimoEvento.dados?.versao || '2026-10-18.1'}.`,
              origem: 'delegate:mcp'
            };
          }
          if (t === 'cofre.item.guardado') {
            return {
              titulo: 'Armazenamento cifrado no dispositivo do cidadão',
              descricao: `Intenção cifrada localmente (AES-256-GCM). O operador municipal e a câmara não têm acesso à chave nem aos dados privados.`,
              origem: 'cidadao:cofre'
            };
          }
          if (t === 'mandato.concedido') {
            return {
              titulo: `Mandato ${ultimoEvento.dados?.nivel} emitido pela Pessoa`,
              descricao: `O cidadão autorizou o Henriques a preparar e agir com confirmação expressa para ${ultimoEvento.dados?.objeto}.`,
              origem: 'cidadao:mandato'
            };
          }
          if (t === 'cofre.pacote.preparado') {
            return {
              titulo: 'Filtro de Privacidade preparou o Pacote Mínimo',
              descricao: 'Apenas os parâmetros estritamente indispensáveis saem para a Câmara. Dados pessoais e privados permanecem protegidos.',
              origem: 'delegate:privacidade'
            };
          }
          if (t === 'su.processo.criado') {
            return {
              titulo: 'Processo Entregue na Câmara Municipal de Guimarães',
              descricao: `Processo ${ultimoEvento.dados?.numero || 'OEP/2026/0001'} registado sob Mandato D3 na Consola dos Técnicos Camarários.`,
              origem: 'camara:servicos'
            };
          }
          return {
            titulo: `Evento Intermediado: ${t}`,
            descricao: `Origem: ${ultimoEvento.origem} · Ator: ${ultimoEvento.ator} · Sessão auditada.`,
            origem: ultimoEvento.origem
          };
        }, [ultimoEvento]);

        const selecionarFerramenta = (f) => {
          setFerramentaAtiva(f);
          const p = { ...f.payloadExemplo, cliente: clienteId };
          setPayloadJson(JSON.stringify(p, null, 2));
          setResposta(null);
        };

        const mudarCliente = (novoCliente) => {
          setClienteId(novoCliente);
          try {
            const parsed = JSON.parse(payloadJson);
            parsed.cliente = novoCliente;
            if (novoCliente === 'agente_externo') {
              delete parsed.mandato;
              delete parsed.token_confirmacao;
            }
            setPayloadJson(JSON.stringify(parsed, null, 2));
          } catch (_) {}
        };

        const executarChamada = async () => {
          setExecutando(true);
          const inicio = performance.now();
          try {
            let args = {};
            try {
              args = JSON.parse(payloadJson);
            } catch (e) {
              setResposta({ status: 400, tempoMs: 0, dados: { erro: 'JSON_INVALIDO', detalhe: e.message } });
              setExecutando(false);
              return;
            }

            const resp = await fetch('http://localhost:4001/mcp', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json, text/event-stream'
              },
              body: JSON.stringify({
                jsonrpc: '2.0',
                id: Date.now(),
                method: 'tools/call',
                params: {
                  name: ferramentaAtiva.nome,
                  arguments: args
                }
              })
            });

            const duracao = Math.round(performance.now() - inicio);
            const rawText = await resp.text();
            let parsedDados = rawText;
            try {
              if (rawText.startsWith('event: message\ndata: ')) {
                const jsonStr = rawText.replace('event: message\ndata: ', '').trim();
                parsedDados = JSON.parse(jsonStr);
              } else {
                parsedDados = JSON.parse(rawText);
              }
            } catch (_) {}

            setResposta({ status: resp.status, tempoMs: duracao, dados: parsedDados });
          } catch (err) {
            setResposta({ status: 500, tempoMs: Math.round(performance.now() - inicio), dados: { erro: 'ERRO_DE_LIGACAO', detalhe: err.message } });
          } finally {
            setExecutando(false);
          }
        };

        return html`

                </span>
              </div>

              <nav class="header-nav">

                  ${ico('raio')}
                  <span>Plataforma Delegate (Integração & MCP)</span>
                </a>
                <span class="divisor-vertical-del"></span>
                <span class="etiqueta-lado-camara">Sistemas da Câmara:</span>
                <a href="/" class="nav-link externo" title="Aceder ao Painel de Atividade Municipal" aria-label="Aceder ao Painel de Atividade Municipal, que sai do sistema Delegate">
                  ${ico('painel')}
                  <span>Painel de Atividade</span>
                  <span class="ico-saida" aria-hidden="true">↗</span>
                </a>
                <a href="/consola" class="nav-link externo" title="Aceder à Consola Técnica dos Serviços Urbanos" aria-label="Aceder à Consola Técnica, que sai do sistema Delegate">
                  ${ico('bustos')}
                  <span>Consola Técnica</span>
                  <span class="ico-saida" aria-hidden="true">↗</span>
                </a>
              </nav>

              <div style=${{ display: 'flex', alignItems: 'center', gap: '0.8rem' }}>
                <div class="status-pill">
                  <span class="status-dot"></span>
                  <span>Servidor MCP :4001 Ativo</span>
                </div>
              </div>
            </div>
          </header>

          <!-- Faixa de Separação de Papéis: Sistema vs Câmara -->
          <div class="faixa-separacao-sistema">
            <div class="separacao-conteudo">
              <div class="pill-distincao-sistema">
                ${ico('engrenagem')}
                <span>Arquitetura do sistema</span>
              </div>
              <div class="separacao-texto">
                <strong>Plataforma de Integração Delegate:</strong> Monitorização em tempo real das chamadas MCP, decisões TypeSafe (Jev), inferência tipada de mandatos (D0 a D4) e fluxo de eventos.
                A Câmara Municipal acede exclusivamente aos seus postos oficiais (<a href="/">Painel de Atividade</a> e <a href="/consola">Consola Técnica</a>).
              </div>
            </div>
          </div>

          <main class="del-corpo">
            <!-- 1. ARQUITETURA DE INTEGRAÇÃO: CIDADÃO ──► DELEGATE ──► CÂMARA -->

              <!-- CAMADA 1: O CIDADÃO -->
              <div class="mundo-card municipe">
                <span class="numero-camada">01</span>
                <div class="mundo-topo">
                  <div class="mundo-titulo">
                    ${ico('pessoa')}

                      <span class="item-nome ico-lista">${ico('mandato')} Mandato Autorizado do Cidadão</span>

                  <div class="item-camada">

                      <span class="item-nome ico-lista">${ico('bustos')} Consola Técnica</span>

                      <span class="item-nome ico-lista">${ico('carteira')} Tesouraria Municipal</span>
                      <span style=${{ color: '#9aa8b8', fontSize: '10px' }}>RTTL 2025</span>
                    </div>
                    <span class="item-sub">Emissão de guias e referências de pagamento das taxas devidas pelo cidadão.</span>
                  </div>
                </div>
              </div>
            </section>

            <!-- 2. RADAR VIVO: ATIVIDADE ATUAL DO AGENTE & MANDATO INFERIDO -->
            <section class="radar-seccao">
              <div class="radar-top-row">
                <!-- Atividade Atual do Agente -->
                <div class="radar-atividade-box">
                  <div class="radar-icone-pulsar">${ico('raio')}</div>
                  <div class="radar-texto">
                    <h2>
                      <span>Atividade do Sistema em Tempo Real:</span>
                      <span style=${{ color: '#8ccfa0' }}>${atividadeAgente.titulo}</span>
                    </h2>
                    <p>${atividadeAgente.descricao}</p>
                  </div>
                </div>

                <!-- Matriz de Mandato Inferido -->
                <div style=${{ display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
                  <div style=${{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span style=${{ fontSize: '11px', fontWeight: '700', textTransform: 'uppercase', color: 'var(--del-texto-secundario)', letterSpacing: '0.05em' }}>
                      Nível de Mandato Inferido:
                    </span>
                    <span style=${{ display: 'inline-flex', alignItems: 'center', gap: '0.3rem', background: 'rgba(112, 187, 134, 0.16)', border: '1px solid rgba(112, 187, 134, 0.42)', borderRadius: '999px', padding: '2px 8px', color: '#8ccfa0', fontSize: '10px', fontWeight: '700' }}>
                      ${ico('raio')}
                      <span>TypeSafe Jev</span>
                    </span>
                  </div>
                  <div class="mandatos-matriz">
                    <div class="mandato-pill ${mandatoAtivo.nivel === 'D0' ? 'ativo' : ''}">
                      <span class="sigla">D0</span>
                      <span class="nome">Informar</span>
                    </div>
                    <div class="mandato-pill ${mandatoAtivo.nivel === 'D1' ? 'ativo' : ''}">
                      <span class="sigla">D1</span>
                      <span class="nome">Vigiar</span>
                    </div>
                    <div class="mandato-pill ${mandatoAtivo.nivel === 'D2' ? 'ativo' : ''}">
                      <span class="sigla">D2</span>
                      <span class="nome">Preparar</span>
                    </div>
                    <div class="mandato-pill ${mandatoAtivo.nivel === 'D3' ? 'ativo' : ''}">
                      <span class="sigla">D3</span>
                      <span class="nome">Confirmar</span>
                    </div>
                    <div class="mandato-pill ${mandatoAtivo.nivel === 'D4' ? 'ativo' : ''}">
                      <span class="sigla">D4</span>
                      <span class="nome">Pleno</span>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- 3. GRELHA DE OPERAÇÕES MCP & CONSOLA INTERATIVA -->
            <section class="grelha-principal">
              <!-- Coluna Esquerda: Ferramentas do Barramento MCP -->
              <div class="painel-box">
                <div class="painel-cabecalho">
                  <h3>
                    ${ico('engrenagem')}
                    <span>Capacidades Expostas no Barramento MCP (:4001)</span>
                  </h3>
                  <span style=${{ fontSize: '11px', color: 'var(--del-texto-suave)', fontFamily: 'var(--font-mono)' }}>MCP Protocol v2</span>
                </div>
                <div class="ferramentas-lista">
                  ${FERRAMENTAS_MCP.map(
                    (f) => html`
                      <div
                        class="ferramenta-card ${ferramentaAtiva.nome === f.nome ? 'selecionada' : ''}"
                        onClick=${() => selecionarFerramenta(f)}
                      >
                        <div class="ferramenta-header-row">
                          <span class="ferramenta-nome">${f.nome}</span>
                          <span class="badge-requisito ${f.badgeCls}">${f.requisito}</span>
                        </div>
                        <p class="ferramenta-desc">${f.descricao}</p>
                      </div>
                    `
                  )}
                </div>
              </div>

              <!-- Coluna Direita: Teste Interativo de Chamadas MCP -->
              <div class="painel-box">
                <div class="painel-cabecalho">
                  <h3>
                    ${ico('laboratorio')}
                    <span>Consola de Chamada MCP em Direto</span>
                  </h3>
                  <span style=${{ fontSize: '11px', color: '#8ccfa0', fontWeight: '700' }}>Streamable HTTP</span>
                </div>
                <div class="playground-corpo">
                  <div>
                    <label style=${{ fontSize: '11.5px', fontWeight: '600', color: 'var(--del-texto-secundario)', marginBottom: '0.4rem', display: 'block' }}>
                      Perfil do Agente Requisitante:
                    </label>
                    <div class="cliente-selector">
                      <button
                        class="cliente-btn ${clienteId === 'henriques' ? 'ativo' : ''}"
                        onClick=${() => mudarCliente('henriques')}
                      >
                        ${ico('escudo')}
                        <span>Henriques (Representante com Mandato)</span>
                      </button>
                      <button
                        class="cliente-btn ${clienteId === 'agente_externo' ? 'ativo' : ''}"
                        onClick=${() => mudarCliente('agente_externo')}
                      >
                        ${ico('aviso')}
                        <span>Agente Externo (Sem Mandato)</span>
                      </button>
                    </div>
                  </div>

                  <div>
                    <div style=${{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>
                      <label style=${{ fontSize: '11.5px', fontWeight: '600', color: 'var(--del-texto-secundario)' }}>
                        Parâmetros da Chamada (JSON):
                      </label>
                      <span style=${{ fontSize: '11px', color: '#8ccfa0', fontFamily: 'var(--font-mono)' }}>
                        ${ferramentaAtiva.nome}
                      </span>
                    </div>
                    <textarea
                      class="payload-box"
                      value=${payloadJson}
                      onInput=${(e) => setPayloadJson(e.target.value)}
                    ></textarea>
                  </div>

                  <button
                    class="btn-executar"
                    onClick=${executarChamada}
                    disabled=${executando}
                  >
                    <span>${executando ? '⏳ A executar…' : '▶ Executar Chamada via Barramento MCP'}</span>
                  </button>

                  ${resposta &&
                  html`
                    <div>
                      <div style=${{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.4rem' }}>
                        <label style=${{ fontSize: '11.5px', fontWeight: '600', color: 'var(--del-texto-secundario)' }}>
                          Resposta do Servidor MCP (:4001):
                        </label>
                        <span style=${{ fontSize: '11px', color: resposta.status === 200 ? '#8ccfa0' : '#ef4444', fontFamily: 'var(--font-mono)' }}>
                          Status ${resposta.status} (${resposta.tempoMs}ms)
                        </span>
                      </div>
                      <pre class="resposta-box">${JSON.stringify(resposta.dados, null, 2)}</pre>
                    </div>
                  `}
                </div>
              </div>
            </section>

            <!-- 4. TABELA DE AUDITORIA DE EVENTOS (SSE) -->
            <section class="painel-box">
              <div class="painel-cabecalho">
                <h3>
                  ${ico('selo')}
                  <span>Registo de Auditoria de Eventos do Sistema (SSE)</span>
                </h3>
                <span style=${{ fontSize: '11px', color: 'var(--del-texto-suave)', fontFamily: 'var(--font-mono)' }}>
                  /eventos/stream · SHA-256
                </span>
              </div>
              <div style=${{ maxHeight: '280px', overflowY: 'auto' }}>
                <table class="tabela-auditoria">
                  <thead>
                    <tr>
                      <th style=${{ width: '70px' }}>Seq</th>
                      <th style=${{ width: '90px' }}>Hora</th>
                      <th style=${{ width: '220px' }}>Tipo de Evento</th>
                      <th style=${{ width: '130px' }}>Ator</th>
                      <th style=${{ width: '100px' }}>Origem</th>
                      <th>Dados do Julgamento e Auditoria</th>
                      <th style=${{ width: '120px' }}>Hash SHA-256</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${eventos.map(
                      (ev) => html`
                        <tr>
                          <td style=${{ fontFamily: 'var(--font-mono)', fontWeight: '700', color: '#8ccfa0' }}>
                            #${ev.seq || '—'}
                          </td>
                          <td style=${{ color: 'var(--del-texto-suave)' }}>
                            ${new Date(ev.ts).toLocaleTimeString('pt-PT')}
                          </td>
                          <td style=${{ fontFamily: 'var(--font-mono)', fontWeight: '600', color: '#ffffff' }}>
                            ${ev.tipo}
                          </td>
                          <td>
                            <span style=${{ color: ev.ator.includes('jev') ? '#8ccfa0' : '#8ccfa0', fontWeight: '600' }}>
                              ${ev.ator}
                            </span>
                          </td>
                          <td>
                            <span style=${{ textTransform: 'uppercase', fontSize: '10px', color: 'var(--del-texto-suave)' }}>
                              ${ev.origem}
                            </span>
                          </td>
                          <td style=${{ color: 'var(--del-texto-secundario)', fontFamily: 'var(--font-mono)', fontSize: '11px' }}>
                            ${JSON.stringify(ev.dados || {}).slice(0, 95)}…
                          </td>
                          <td class="hash-mono">
                            ${(ev.hash || '—').slice(0, 8)}…
                          </td>
                        </tr>
                      `
                    )}
                  </tbody>
                </table>
              </div>
            </section>
          </main>
        `;
      }

      render(html`<${App} />`, document.getElementById('root'));
    </script>
  </body>
</html>
