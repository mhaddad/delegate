<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delegate · Protocolo de Integração Agêntica MCP</title>

    <!-- Favicon e Ícones do Delegate -->
    <link rel="shortcut icon" href="/assets/delegate-symbol.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/delegate-symbol.png" />

    <!-- Tipografia Moderna: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Paleta Delegate · Plataforma de Integração MCP */
        --del-fundo-obs: #07090e;
        --del-fundo: #0d111a;
        --del-cartao: rgba(18, 24, 38, 0.75);
        --del-cartao-destaque: rgba(26, 34, 54, 0.85);
        --del-borda: rgba(255, 255, 255, 0.08);
        --del-borda-brilhante: rgba(139, 92, 246, 0.35);

        --del-indigo: #6366f1;
        --del-roxo: #8b5cf6;
        --del-violeta: #a855f7;
        --del-ciano: #06b6d4;
        --del-verde: #10b981;
        --del-ambar: #f59e0b;
        --del-vermelho: #ef4444;

        --del-texto: #f8fafc;
        --del-texto-secundario: #94a3b8;
        --del-texto-suave: #64748b;

        --font-primary: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: var(--del-fundo-obs);
        background-image:
          radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
          radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.10) 0%, transparent 45%),
          radial-gradient(circle at 50% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 50%);
        color: var(--del-texto);
        font-family: var(--font-primary);
        font-size: 13.5px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      /* 1. CABEÇALHO DELEGA */
      header.del-header {
        background: rgba(13, 17, 26, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--del-borda);
        padding: 0.75rem 2rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .header-conteudo {
        max-width: 1760px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .logo-area {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .logo-delegate-header {
        height: 38px;
        width: auto;
        display: block;
        filter: drop-shadow(0 2px 8px rgba(99, 102, 241, 0.3));
      }

      .tag-intermediario {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
        border: 1px solid rgba(139, 92, 246, 0.4);
        color: #c084fc;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .header-nav {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .nav-link {
        color: var(--del-texto-secundario);
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 600;
        padding: 0.45rem 0.9rem;
        border-radius: 6px;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        border: 1px solid transparent;
      }

      .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.05);
      }

      .nav-link.ativo {
        color: #ffffff;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.35);
        box-shadow: 0 0 16px rgba(99, 102, 241, 0.2);
      }

      .nav-link.externo {
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.2);
        background: rgba(56, 189, 248, 0.05);
      }
      .nav-link.externo:hover {
        background: rgba(56, 189, 248, 0.15);
      }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        color: #34d399;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 10px #10b981;
        animation: pulso 2s infinite;
      }

      @keyframes pulso {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.15); }
      }

      .divisor-vertical-del {
        height: 22px;
        width: 1px;
        background: rgba(255, 255, 255, 0.15);
        margin: 0 0.5rem;
      }

      .etiqueta-lado-camara {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--del-texto-suave);
        margin-right: 0.25rem;
      }

      .faixa-separacao-sistema {
        background: linear-gradient(90deg, rgba(30, 27, 75, 0.95), rgba(17, 24, 39, 0.95));
        border-bottom: 1px solid rgba(139, 92, 246, 0.3);
        padding: 0.65rem 1.75rem;
      }

      .separacao-conteudo {
        max-width: 1720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .pill-distincao-sistema {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(139, 92, 246, 0.25);
        border: 1px solid rgba(168, 85, 247, 0.5);
        color: #e9d5ff;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 0.3rem 0.75rem;
        border-radius: 4px;
        white-space: nowrap;
      }

      .separacao-texto {
        font-size: 12.5px;
        color: #cbd5e1;
        line-height: 1.4;
      }

      .separacao-texto strong {
        color: #f8fafc;
      }

      /* 2. LAYOUT PRINCIPAL */
      main.del-corpo {
        max-width: 1760px;
        margin: 0 auto;
        padding: 1.5rem 2rem 3rem;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        flex: 1;
      }

      /* 3. ARQUITETURA DE INTEGRAÇÃO (3 CAMADAS) */
      .triptico-container {
        display: grid;
        grid-template-columns: 1fr 1.35fr 1fr;
        gap: 1.25rem;
      }

      .mundo-card {
        background: var(--del-cartao);
        border: 1px solid var(--del-borda);
        border-radius: 12px;
        padding: 1.25rem 1.4rem;
        position: relative;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: border-color 0.2s ease, transform 0.2s ease;
      }

      .mundo-card:hover {
        border-color: rgba(255, 255, 255, 0.15);
      }

      .mundo-card.municipe {
        border-top: 3px solid var(--del-ciano);
      }

      .mundo-card.intermediario {
        border-top: 3px solid var(--del-roxo);
        background: linear-gradient(180deg, rgba(139, 92, 246, 0.08) 0%, rgba(18, 24, 38, 0.85) 100%);
        box-shadow: 0 4px 30px rgba(124, 58, 237, 0.12);
      }

      .mundo-card.camara {
        border-top: 3px solid var(--del-ambar);
      }

      .mundo-topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.85rem;
        padding-bottom: 0.65rem;
        border-bottom: 1px solid var(--del-borda);
      }

      .mundo-titulo {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .badge-mundo {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .badge-municipe { background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); }
      .badge-del { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
      .badge-camara { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

      .lista-itens {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .item-camada {
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        padding: 0.65rem 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .item-cabecalho {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .item-nome {
        font-size: 12px;
        font-weight: 600;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .item-sub {
        font-size: 11px;
        color: var(--del-texto-secundario);
      }

      /* 4. RADAR EM TEMPO REAL: EVENTOS & MANDATO INFERIDO */
      .radar-seccao {
        background: var(--del-cartao-destaque);
        border: 1px solid var(--del-borda-brilhante);
        border-radius: 12px;
        padding: 1.25rem 1.6rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        box-shadow: 0 4px 35px rgba(0, 0, 0, 0.4);
      }

      .radar-top-row {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 1.5rem;
        align-items: center;
      }

      .radar-atividade-box {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
      }

      .radar-icone-pulsar {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
      }

      .radar-texto h2 {
        font-size: 14.5px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.2rem;
      }

      .radar-texto p {
        font-size: 12px;
        color: var(--del-texto-secundario);
        line-height: 1.45;
      }

      /* Matriz de Mandato D0-D4 */
      .mandatos-matriz {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.45rem;
      }

      .mandato-pill {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 0.45rem 0.25rem;
        text-align: center;
        transition: all 0.25s ease;
      }

      .mandato-pill .sigla {
        font-size: 13px;
        font-weight: 800;
        font-family: var(--font-mono);
        color: var(--del-texto-suave);
        display: block;
      }

      .mandato-pill .nome {
        font-size: 10px;
        color: var(--del-texto-secundario);
        display: block;
        margin-top: 1px;
      }

      .mandato-pill.ativo {
        background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.3));
        border: 1px solid rgba(245, 158, 11, 0.7);
        box-shadow: 0 0 16px rgba(245, 158, 11, 0.35);
        transform: translateY(-2px);
      }

      .mandato-pill.ativo .sigla {
        color: #fde047;
      }

      .mandato-pill.ativo .nome {
        color: #fef08a;
        font-weight: 700;
      }

      /* 5. GRELHA DE TRABALHO: CAPACIDADES MCP & CONSOLA INTERATIVA */
      .grelha-principal {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 1.25rem;
      }

      .painel-box {
        background: var(--del-cartao);
        border: 1px solid var(--del-borda);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .painel-cabecalho {
        padding: 0.9rem 1.25rem;
        border-bottom: 1px solid var(--del-borda);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.02);
      }

      .painel-cabecalho h3 {
        font-size: 13.5px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      /* Lista de Ferramentas MCP */
      .ferramentas-lista {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.25rem;
        max-height: 520px;
        overflow-y: auto;
      }

      .ferramenta-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--del-borda);
        border-radius: 10px;
        padding: 0.9rem 1.1rem;
        transition: all 0.2s ease;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .ferramenta-card:hover {
        background: rgba(99, 102, 241, 0.06);
        border-color: rgba(99, 102, 241, 0.3);
      }

      .ferramenta-card.selecionada {
        background: rgba(99, 102, 241, 0.12);
        border-color: rgba(99, 102, 241, 0.6);
        box-shadow: 0 0 14px rgba(99, 102, 241, 0.2);
      }

      .ferramenta-header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ferramenta-nome {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
      }

      .ferramenta-desc {
        font-size: 12px;
        color: var(--del-texto-secundario);
      }

      .badge-requisito {
        font-size: 10px;
        font-weight: 700;
        font-family: var(--font-mono);
        padding: 2px 7px;
        border-radius: 4px;
        text-transform: uppercase;
      }

      .badge-publico { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
      .badge-mandato-d2 { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
      .badge-mandato-d3 { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

      /* Playground MCP */
      .playground-corpo {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .cliente-selector {
        display: flex;
        gap: 0.6rem;
      }

      .cliente-btn {
        flex: 1;
        padding: 0.55rem 0.8rem;
        border-radius: 6px;
        border: 1px solid var(--del-borda);
        background: rgba(255, 255, 255, 0.02);
        color: var(--del-texto-secundario);
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        transition: all 0.2s ease;
      }

      .cliente-btn.ativo {
        background: rgba(99, 102, 241, 0.2);
        border-color: rgba(99, 102, 241, 0.5);
        color: #ffffff;
      }

      textarea.payload-box {
        width: 100%;
        height: 140px;
        background: #080a10;
        border: 1px solid var(--del-borda);
        border-radius: 8px;
        color: #38bdf8;
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 0.75rem;
        resize: vertical;
      }

      button.btn-executar {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #ffffff;
        border: none;
        padding: 0.75rem 1.2rem;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.2s ease;
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      }

      button.btn-executar:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      }

      pre.resposta-box {
        background: #080a10;
        border: 1px solid var(--del-borda);
        border-radius: 8px;
        padding: 0.85rem;
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: #a7f3d0;
        max-height: 180px;
        overflow-y: auto;
      }

      /* 6. TABELA DE AUDITORIA SSE */
      .tabela-auditoria {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .tabela-auditoria th {
        background: rgba(255, 255, 255, 0.03);
        border-bottom: 1px solid var(--del-borda);
        padding: 0.65rem 1rem;
        text-align: left;
        font-weight: 700;
        color: var(--del-texto-secundario);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .tabela-auditoria td {
        padding: 0.65rem 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        color: var(--del-texto);
      }

      .tabela-auditoria tr:hover td {
        background: rgba(255, 255, 255, 0.02);
      }

      .hash-mono {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--del-texto-suave);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Preact + HTM via CDN ESM -->
    <script type="module">
      import { h, render } from 'https://esm.sh/preact@10.23.2';
      import { useState, useEffect, useMemo } from 'https://esm.sh/preact@10.23.2/hooks';
      import htm from 'https://esm.sh/htm@3.1.1';

      const html = htm.bind(h);

      const FERRAMENTAS_MCP = [
        {
          nome: 'procurar_servicos',
          tipo: 'LEITURA',
          requisito: 'Livre (Público)',
          badgeCls: 'badge-publico',
          descricao: 'Pesquisa livre no catálogo normativo autárquico. Devolve pontuação de aderência e versão oficial.',
          payloadExemplo: { consulta: 'quero colocar esplanada no passeio', limite: 3 }
        },
        {
          nome: 'obter_servico',
          tipo: 'LEITURA',
          requisito: 'Livre (Público)',
          badgeCls: 'badge-publico',
          descricao: 'Devolve a ficha completa do procedimento municipal, enquadramento normativo, versão e fontes verificadas.',
          payloadExemplo: { id: 'ocupacao-espaco-publico-esplanada' }
        },
        {
          nome: 'calcular_taxa_esplanada',
          tipo: 'SIMULAÇÃO',
          requisito: 'Livre (Público)',
          badgeCls: 'badge-publico',
          descricao: 'Cálculo de taxas de ocupação segundo a Tabela de Taxas e Licenças (RTTL 2025).',
          payloadExemplo: { area_m2: 10, meses: 6 }
        },
        {
          nome: 'verificar_conformidade_tecnica',
          tipo: 'VALIDAÇÃO',
          requisito: 'Livre (Público)',
          badgeCls: 'badge-publico',
          descricao: 'Verificação regulamentar de calçada (corredor de peões >= 2,00m livres segundo o Regulamento).',
          payloadExemplo: { largura_passeio_m: 2.1 }
        },
        {
          nome: 'criar_rascunho_ocupacao',
          tipo: 'AÇÃO SEGURA',
          requisito: 'Mandato D2 (Preparar)',
          badgeCls: 'badge-mandato-d2',
          descricao: 'Cria um rascunho instrutório de comunicação prévia. Rejeita imediatamente sem mandato D2.',
          payloadExemplo: {
            mandato: 'MAN-2026-0001',
            localizacao: 'Largo da Oliveira, 12',
            area_m2: 10,
            meses: 6,
            cliente: 'afonso'
          }
        },
        {
          nome: 'submeter_comunicacao_previa',
          tipo: 'AÇÃO VINCULATIVA',
          requisito: 'Mandato D3 + Assinatura CMD',
          badgeCls: 'badge-mandato-d3',
          descricao: 'Submete formalmente a comunicação prévia à Câmara. Exige mandato D3 e token de autorização do munícipe.',
          payloadExemplo: {
            mandato: 'MAN-2026-0001',
            token_confirmacao: 'cmd-token-valido-123',
            rascunho_id: 'RASC-OEP-0001',
            cliente: 'afonso'
          }
        },
        {
          nome: 'obter_referencia_pagamento',
          tipo: 'LIQUIDAÇÃO',
          requisito: 'Mandato D2+ (Liquidar)',
          badgeCls: 'badge-mandato-d2',
          descricao: 'Emite referência Multibanco para liquidação das taxas regulamentares municipais.',
          payloadExemplo: {
            processo: 'OEP/2026/0001',
            mandato: 'MAN-2026-0001',
            cliente: 'afonso'
          }
        }
      ];

      function App() {
        const [eventos, setEventos] = useState([]);
        const [ultimoEvento, setUltimoEvento] = useState(null);
        const [ferramentaAtiva, setFerramentaAtiva] = useState(FERRAMENTAS_MCP[0]);
        const [clienteId, setClienteId] = useState('afonso');
        const [payloadJson, setPayloadJson] = useState(JSON.stringify(FERRAMENTAS_MCP[0].payloadExemplo, null, 2));
        const [resposta, setResposta] = useState(null);
        const [executando, setExecutando] = useState(false);
        const [mandatoAtivo, setMandatoAtivo] = useState({ nivel: 'D0', id: 'MAN-D0-LIVRE', objeto: 'Consulta Pública' });

        // Conexão Server-Sent Events ao barramento
        useEffect(() => {
          let es;
          try {
            es = new EventSource('/eventos/stream');
            es.onmessage = (e) => {
              try {
                const ev = JSON.parse(e.data);
                setUltimoEvento(ev);
                setEventos((prev) => [ev, ...prev].slice(0, 30));

                if (ev.tipo === 'afonso.intencao.classificada' && ev.dados?.mandato_inferido) {
                  setMandatoAtivo({
                    nivel: ev.dados.mandato_inferido,
                    id: ev.dados.motor === 'typesafe-jev' ? 'MAN-JEV-INFERIDO' : 'MAN-2026-0001',
                    objeto: ev.dados.intencao || 'Ocupação de Espaço Público'
                  });
                }
                if (ev.tipo === 'mandato.concedido') {
                  setMandatoAtivo({
                    nivel: ev.dados?.nivel || 'D3',
                    id: ev.dados?.id || 'MAN-2026-0001',
                    objeto: ev.dados?.objeto || 'Casa Joaquim'
                  });
                }
              } catch (_) {}
            };
          } catch (_) {}
          return () => es?.close();
        }, []);

        const atividadeAgente = useMemo(() => {
          if (!ultimoEvento) {
            return {
              titulo: 'Intermediário em Escuta Contínua',
              descricao: 'A monitorizar a fronteira de comunicação entre munícipes (Afonso/Telegram) e os serviços municipais da autarquia.',
              origem: 'delegate:idle'
            };
          }
          const t = ultimoEvento.tipo;
          if (t === 'canal.mensagem.recebida') {
            return {
              titulo: 'Munícipe contactou o Afonso no Telegram',
              descricao: `Mensagem: «${ultimoEvento.dados?.texto || '...'}». Afonso ativa o motor de inferência TypeSafe Jev.`,
              origem: 'telegram:municipe'
            };
          }
          if (t === 'afonso.intencao.classificada') {
            const isJev = ultimoEvento.dados?.motor === 'typesafe-jev';
            return {
              titulo: isJev ? '⚡ TypeSafe Jev inferiu Intenção e Mandato em Tempo Real' : 'Afonso classificou a intenção do munícipe',
              descricao: `Procedimento: ${ultimoEvento.dados?.intencao} · Mandato: ${ultimoEvento.dados?.mandato_inferido || 'D0'} · Confiança: ${Math.round((ultimoEvento.dados?.confianca || 1)*100)}% (${ultimoEvento.dados?.tempo_ms || 250}ms).`,
              origem: 'typesafe:jev'
            };
          }
          if (t === 'porta.servicos.procurados' || t === 'porta.servico.obtido') {
            return {
              titulo: 'Barramento MCP v2 consultado (:4001)',
              descricao: `Ficha oficial solicitada à autarquia com neutralidade e minimização de dados. Versão ${ultimoEvento.dados?.versao || '2026-10-18.1'}.`,
              origem: 'delegate:mcp'
            };
          }
          if (t === 'cofre.item.guardado') {
            return {
              titulo: 'Armazenamento cifrado no dispositivo do munícipe',
              descricao: `Intenção cifrada localmente (AES-256-GCM). O operador municipal e a câmara não têm acesso à chave nem aos dados privados.`,
              origem: 'municipe:cofre'
            };
          }
          if (t === 'mandato.concedido') {
            return {
              titulo: `Mandato ${ultimoEvento.dados?.nivel} emitido pela Pessoa`,
              descricao: `O munícipe autorizou o Afonso a preparar e agir com confirmação expressa para ${ultimoEvento.dados?.objeto}.`,
              origem: 'municipe:mandato'
            };
          }
          if (t === 'cofre.pacote.preparado') {
            return {
              titulo: 'Filtro de Privacidade preparou o Pacote Mínimo',
              descricao: 'Apenas os parâmetros estritamente indispensáveis saem para a Câmara. Dados pessoais e privados permanecem protegidos.',
              origem: 'delegate:privacidade'
            };
          }
          if (t === 'su.processo.criado') {
            return {
              titulo: 'Processo Entregue na Câmara Municipal de Guimarães',
              descricao: `Processo ${ultimoEvento.dados?.numero || 'OEP/2026/0001'} registado sob Mandato D3 na Consola dos Técnicos Camarários.`,
              origem: 'camara:servicos'
            };
          }
          return {
            titulo: `Evento Intermediado: ${t}`,
            descricao: `Origem: ${ultimoEvento.origem} · Ator: ${ultimoEvento.ator} · Sessão auditada.`,
            origem: ultimoEvento.origem
          };
        }, [ultimoEvento]);

        const selecionarFerramenta = (f) => {
          setFerramentaAtiva(f);
          const p = { ...f.payloadExemplo, cliente: clienteId };
          setPayloadJson(JSON.stringify(p, null, 2));
          setResposta(null);
        };

        const mudarCliente = (novoCliente) => {
          setClienteId(novoCliente);
          try {
            const parsed = JSON.parse(payloadJson);
            parsed.cliente = novoCliente;
            if (novoCliente === 'agente_externo') {
              delete parsed.mandato;
              delete parsed.token_confirmacao;
            }
            setPayloadJson(JSON.stringify(parsed, null, 2));
          } catch (_) {}
        };

        const executarChamada = async () => {
          setExecutando(true);
          const inicio = performance.now();
          try {
            let args = {};
            try {
              args = JSON.parse(payloadJson);
            } catch (e) {
              setResposta({ status: 400, tempoMs: 0, dados: { erro: 'JSON_INVALIDO', detalhe: e.message } });
              setExecutando(false);
              return;
            }

            const resp = await fetch('http://localhost:4001/mcp', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json, text/event-stream'
              },
              body: JSON.stringify({
                jsonrpc: '2.0',
                id: Date.now(),
                method: 'tools/call',
                params: {
                  name: ferramentaAtiva.nome,
                  arguments: args
                }
              })
            });

            const duracao = Math.round(performance.now() - inicio);
            const rawText = await resp.text();
            let parsedDados = rawText;
            try {
              if (rawText.startsWith('event: message\ndata: ')) {
                const jsonStr = rawText.replace('event: message\ndata: ', '').trim();
                parsedDados = JSON.parse(jsonStr);
              } else {
                parsedDados = JSON.parse(rawText);
              }
            } catch (_) {}

            setResposta({ status: resp.status, tempoMs: duracao, dados: parsedDados });
          } catch (err) {
            setResposta({ status: 500, tempoMs: Math.round(performance.now() - inicio), dados: { erro: 'ERRO_DE_LIGACAO', detalhe: err.message } });
          } finally {
            setExecutando(false);
          }
        };

        return html`
          <header class="del-header">

                <div class="status-pill">
                  <span class="status-dot"></span>
                  <span>Servidor MCP :4001 Ativo</span>
                </div>
              </div>
            </div>
          </header>

          <!-- Faixa de Separação de Papéis: Sistema vs Câmara -->
          <div class="faixa-separacao-sistema">
            <div class="separacao-conteudo">
              <div class="pill-distincao-sistema">
                <span>⚙️</span>
                <span>ARQUITETURA DO SISTEMA</span>
              </div>
              <div class="separacao-texto">
                <strong>Plataforma de Integração Delegate:</strong> Monitorização em tempo real das chamadas MCP, decisões TypeSafe (Jev), inferência tipada de mandatos (D0 a D4) e fluxo de eventos.
                A Câmara Municipal acede exclusivamente aos seus postos oficiais (<a href="/" style=${{ color: '#93c5fd', textDecoration: 'underline' }}>Painel de Atividade</a> e <a href="/consola" style=${{ color: '#93c5fd', textDecoration: 'underline' }}>Consola Técnica</a>).
              </div>

              <!-- CAMADA 3: SERVIÇOS MUNICIPAIS -->

                  ${resposta &&

            <!-- 4. TABELA DE AUDITORIA DE EVENTOS (SSE) -->
            <section class="painel-box">

                          <td>
                            <span style=${{ color: ev.ator.includes('jev') ? '#c084fc' : '#38bdf8', fontWeight: '600' }}>
                              ${ev.ator}
                            </span>
                          </td>
                          <td>
                            <span style=${{ textTransform: 'uppercase', fontSize: '10px', color: 'var(--del-texto-suave)' }}>
                              ${ev.origem}
                            </span>
                          </td>
                          <td style=${{ color: 'var(--del-texto-secundario)', fontFamily: 'var(--font-mono)', fontSize: '11px' }}>
                            ${JSON.stringify(ev.dados || {}).slice(0, 95)}…
                          </td>
                          <td class="hash-mono">
                            ${(ev.hash || '—').slice(0, 8)}…
                          </td>
                        </tr>
                      `
                    )}
                  </tbody>
                </table>
              </div>
            </section>
          </main>
        `;
      }

      render(html`<${App} />`, document.getElementById('root'));
    </script>
  </body>
</html>
