<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Município de Guimarães · Painel de Atividade</title>

    <!-- Favicon e Ícones Oficiais do Município de Guimarães -->
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Tipografia Oficial de cm-guimaraes.pt: Barlow -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Paleta Oficial e Institucional do Município de Guimarães (cm-guimaraes.pt) */
        --cmg-azul-escuro: #08244c;
        --cmg-azul-medio: #0555b4;
        --cmg-azul-hover: #043c7e;
        --cmg-azul-claro: #e6eef8;
        --cmg-azul-destaque: #cdddf0;

        --cmg-fundo: #edf2f7;
        --cmg-superficie: #ffffff;
        --cmg-borda: #cbd5e1;
        --cmg-borda-escura: #94a3b8;

        --cmg-texto: #0f172a;
        --cmg-texto-secundario: #334155;
        --cmg-texto-suave: #64748b;

        --cmg-verde: #1e7e34;
        --cmg-verde-bg: #edf7ed;
        --cmg-verde-borda: #b7dfb9;

        --cmg-ambar: #b45309;
        --cmg-ambar-bg: #fffbeb;
        --cmg-ambar-borda: #fde68a;

        --font-primary: 'Barlow', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-condensed: 'Barlow Condensed', 'Barlow', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: var(--cmg-fundo);
        color: var(--cmg-texto);
        font-family: var(--font-primary);
        font-size: 13.5px;
        line-height: 1.5;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* =========================================================================
         1. CABEÇALHO OFICIAL AUTÁRQUICO
         ========================================================================= */
      header.cmg-header {
        background: var(--cmg-azul-escuro);
        color: #ffffff;
        border-bottom: 3px solid var(--cmg-azul-medio);
        padding: 0.65rem 1.75rem;
        flex-shrink: 0;
        z-index: 100;
        min-height: 60px;
        display: flex;
        align-items: center;
      }

      .header-conteudo {
        max-width: 1720px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .logo-area {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .logo-guimaraes {
        height: 38px;
        width: auto;
        display: block;
      }

      .divisor-vertical {
        height: 28px;
        width: 1px;
        background: rgba(255, 255, 255, 0.22);
      }

      .titulos-autarquia h1 {
        font-family: var(--font-condensed);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #ffffff;
        line-height: 1.15;
      }

      .titulos-autarquia p {
        font-size: 11.5px;
        color: var(--cmg-azul-claro);
      }

      .nav-links-menu {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .nav-item {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 600;
        padding: 0.45rem 0.85rem;
        border-radius: 3px;
        transition: all 0.15s;
      }

      .nav-item:hover, .nav-item.ativo {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }

      .nav-item.destaque-delegate {
        background: rgba(112, 187, 134, 0.16);
        border: 1px solid rgba(112, 187, 134, 0.40);
        color: #2f7d4c;
        font-weight: 600;
      }
      .nav-item.destaque-delegate:hover {
        background: rgba(112, 187, 134, 0.28);
        color: #1f5c37;
      }

      .divisor-menu {
        height: 18px;
        width: 1px;
        background: rgba(255, 255, 255, 0.22);
        margin: 0 0.35rem;
      }

      .badge-simulacao {
        background: #fff8e1;
        color: #b78103;
        border: 1px solid #ffe082;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.25rem 0.65rem;
        border-radius: 2px;
      }

      .header-controles {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .btn-modo {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        font-family: var(--font-primary);
        font-size: 11.5px;
        font-weight: 600;
        padding: 0.35rem 0.75rem;
        border-radius: 3px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .btn-modo:hover, .btn-modo.ativo {
        background: var(--cmg-azul-medio);
        border-color: #ffffff;
      }

      .indicador-ao-vivo {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 11.5px;
        font-weight: 700;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.3);
        padding: 0.3rem 0.7rem;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .ponto-vivo {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #27ae60;
        box-shadow: 0 0 0 2px rgba(39, 174, 96, 0.35);
      }

      /* =========================================================================
         2. FAIXA DE FACTO AUDITADO (Barra Superior de Notícias Autárquica)
         ========================================================================= */
      .faixa-facto {
        background: #ffffff;
        border-bottom: 1px solid var(--cmg-borda);
        padding: 0.55rem 1.75rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-shrink: 0;
      }

      .facto-legenda {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        font-size: 13px;
        color: var(--cmg-azul-escuro);
      }

      .tag-facto {
        font-family: var(--font-condensed);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--cmg-azul-escuro);
        color: #ffffff;
        padding: 0.2rem 0.55rem;
        border-radius: 2px;
      }

      .facto-texto-destaque {
        font-weight: 600;
        color: var(--cmg-texto);
      }

      .facto-tipo-evento {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--cmg-texto-suave);
        background: #f1f5f9;
        border: 1px solid var(--cmg-borda);
        padding: 0.15rem 0.45rem;
        border-radius: 2px;
      }

      /* =========================================================================
         3. CORPO DO PAINEL DE ATIVIDADE (Layout em 2 Zonas)
         ========================================================================= */
      .painel-layout {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 410px;
        gap: 1.25rem;
        padding: 1rem 1.75rem;
        max-width: 1720px;
        margin: 0 auto;
        width: 100%;
        overflow: hidden;
      }

      .zona-palco-grafo {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        overflow: hidden;
      }

      /* Módulos Autárquicos Sóbrios */
      .modulo-autarquico {
        background: #ffffff;
        border: 1px solid var(--cmg-borda);
        border-top: 3px solid var(--cmg-azul-escuro);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .modulo-cabecalho {
        padding: 0.75rem 1.15rem;
        background: #f8fafc;
        border-bottom: 1px solid var(--cmg-borda);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .modulo-cabecalho h2, .modulo-cabecalho h3 {
        font-family: var(--font-condensed);
        font-size: 13.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--cmg-azul-escuro);
      }

      /* Palco do Cidadão: Conversação Autárquica Real */
      .palco-corpo {
        padding: 0.85rem 1.15rem;
        background: #ffffff;
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .linha-dialogo {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        max-width: 90%;
      }

      .linha-dialogo.municipe {
        align-self: flex-start;
      }

      .linha-dialogo.henriques {
        align-self: flex-end;
        max-width: 94%;
      }

      .dialogo-remetente {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--cmg-texto-suave);
      }

      .dialogo-balao {
        padding: 0.65rem 0.95rem;
        border-radius: 3px;
        font-size: 12.5px;
        line-height: 1.45;
        border: 1px solid var(--cmg-borda);
      }

      .dialogo-balao.balao-municipe {
        background: #f8fafc;
        border-left: 3px solid #94a3b8;
        color: var(--cmg-texto);
      }

      .dialogo-balao.balao-henriques {
        background: #f4f8fd;
        border-left: 3px solid var(--cmg-azul-medio);
        color: var(--cmg-azul-escuro);
      }

      .caixa-citacao-oficial {
        margin-top: 0.45rem;
        padding: 0.45rem 0.75rem;
        background: #ffffff;
        border: 1px solid var(--cmg-azul-destaque);
        border-radius: 2px;
        font-size: 11px;
        color: var(--cmg-texto-secundario);
      }

      .caixa-citacao-oficial strong {
        color: var(--cmg-azul-medio);
      }

      /* Grafo da Infraestrutura Agêntica (Esquema de Barramento Autárquico) */
      .grafo-corpo {
        padding: 0.65rem 1rem;
        background: #f8fafc;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 0.65rem;
        align-items: stretch;
      }

      .nodo-barramento {
        background: #ffffff;
        border: 1px solid var(--cmg-borda);
        border-radius: 2px;
        padding: 0.55rem 0.35rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.15rem;
        position: relative;
        transition: all 0.2s;
      }

      .nodo-barramento.ativo {
        border-color: var(--cmg-azul-medio);
        background: #eef5fc;
        box-shadow: 0 0 0 1px var(--cmg-azul-medio);
      }

      .nodo-protocolo-tag {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--cmg-texto-suave);
        letter-spacing: 0.05em;
      }

      .nodo-titulo-texto {
        font-family: var(--font-condensed);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--cmg-azul-escuro);
      }

      .nodo-descricao-texto {
        font-size: 10.5px;
        color: var(--cmg-texto-secundario);
      }

      .nodo-simulacao-flag {
        position: absolute;
        top: -6px;
        right: 4px;
        background: #fff8e1;
        color: #b78103;
        border: 1px solid #ffe082;
        font-size: 8.5px;
        font-weight: 800;
        text-transform: uppercase;
        padding: 0.05rem 0.35rem;
        border-radius: 2px;
      }

      /* =========================================================================
         4. PAINEL LATERAL (Tramitação e Proteção de Dados)
         ========================================================================= */
      .zona-lateral-painel {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        overflow-y: auto;
      }

      /* Ficha de Tramitação da Missão */
      .tabela-tramitacao-missao {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .tabela-tramitacao-missao td {
        padding: 0.55rem 0.85rem;
        border-bottom: 1px solid #e2e8f0;
      }

      .missao-etapa-num {
        width: 28px;
        font-family: var(--font-mono);
        font-weight: 700;
        color: var(--cmg-texto-suave);
      }

      .missao-etapa-desc {
        color: var(--cmg-texto);
      }

      .missao-etapa-status {
        text-align: right;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .status-concluido {
        color: var(--cmg-verde);
      }

      .status-em-curso {
        color: var(--cmg-azul-medio);
      }

      .status-pendente {
        color: var(--cmg-texto-suave);
      }

      /* Armazenamento Local Cifrado */
      .camada-cifrada-item {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e2e8f0;
      }

      .camada-cifrada-item:last-child {
        border-bottom: none;
      }

      .camada-cifrada-topo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.35rem;
      }

      .camada-cifrada-titulo {
        font-family: var(--font-condensed);
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--cmg-azul-escuro);
        letter-spacing: 0.04em;
      }

      .camada-cifrada-pill {
        font-size: 9.5px;
        font-weight: 700;
        text-transform: uppercase;
        padding: 0.1rem 0.4rem;
        border-radius: 2px;
      }

      .pill-autorizado {
        background: var(--cmg-verde-bg);
        color: var(--cmg-verde);
        border: 1px solid var(--cmg-verde-borda);
      }

      .pill-privado {
        background: #f1f5f9;
        color: var(--cmg-texto-suave);
        border: 1px solid var(--cmg-borda);
      }

      .camada-cifrada-dados {
        background: #f8fafc;
        border: 1px solid var(--cmg-borda);
        border-radius: 2px;
        padding: 0.45rem 0.65rem;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--cmg-texto);
      }

      /* =========================================================================
         5. LINHA DE AUDITORIA DE EVENTOS (Rodapé Oficial)
         ========================================================================= */
      footer.cmg-auditoria-footer {
        background: #ffffff;
        border-top: 1px solid var(--cmg-borda);
        padding: 0.5rem 1.75rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-shrink: 0;
        overflow-x: auto;
      }

      .auditoria-rotulo {
        font-family: var(--font-condensed);
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--cmg-azul-escuro);
        white-space: nowrap;
      }

      .auditoria-stream-scroll {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        overflow-x: auto;
        flex: 1;
      }

      .auditoria-badge-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: #f8fafc;
        border: 1px solid var(--cmg-borda);
        padding: 0.2rem 0.5rem;
        border-radius: 2px;
        font-size: 11px;
        white-space: nowrap;
      }

      .auditoria-seq {
        font-weight: 700;
        color: var(--cmg-azul-medio);
      }

      .auditoria-tipo {
        font-family: var(--font-mono);
        color: var(--cmg-texto);
      }

      .auditoria-hash {
        font-family: var(--font-mono);
        color: var(--cmg-texto-suave);
        font-size: 10px;
      }

      /* Visibilidade de foco: o teclado tem de ver onde está. */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--cmg-azul-medio);
        outline-offset: 2px;
        border-radius: 2px;
      }

      /* Alvos de toque: mínimo ~44px. */
      .btn-modo { min-height: 44px; }

      /* Movimento reduzido: mantém o feedback de estado, remove o movimento. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ---- Responsivo ----
         O painel não transbordava, mas a grelha de duas zonas e a de seis
         colunas do grafo ficariam ilegíveis estreitas. */
      @media (max-width: 1100px) {
        .painel-layout { grid-template-columns: 1fr; }
        .grafo-corpo { grid-template-columns: repeat(3, 1fr); }
      }

      @media (max-width: 640px) {
        .painel-layout { padding: 1rem 1.25rem; gap: 1rem; }
        .grafo-corpo { grid-template-columns: repeat(2, 1fr); }
        .cmg-header { padding-left: 1.25rem; padding-right: 1.25rem; }
        .header-conteudo { flex-wrap: wrap; gap: 0.75rem; }
        /* Tabelas de dados: scroll controlado em vez de transbordo da página. */
        table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Carregamento Modular de React 18 e HTM via CDN ESM Seguro -->
    <script type="module">
      import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.3.1';
      import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';
      import htm from 'https://esm.sh/htm@3.1.1';

      const html = htm.bind(React.createElement);

      function PainelAtividadeApp() {
        const [eventos, setEventos] = useState([]);
        const [ultimoEvento, setUltimoEvento] = useState(null);
        const [modoTecnico, setModoTecnico] = useState(false);
        const [nodoAtivo, setNodoAtivo] = useState('henriques');
        const [conectado, setConectado] = useState(true);

        useEffect(() => {
          let es = null;
          try {
            es = new EventSource('/eventos/stream');
            es.onopen = () => setConectado(true);
            es.onmessage = (msg) => {
              try {
                const ev = JSON.parse(msg.data);
                setEventos((prev) => [ev, ...prev].slice(0, 50));
                setUltimoEvento(ev);

                if (ev.origem === 'canal') setNodoAtivo('canal');
                else if (ev.origem === 'henriques') setNodoAtivo('henriques');
                else if (ev.origem === 'politica' || ev.origem === 'mandatos' || ev.origem === 'cofre') setNodoAtivo('politica');
                else if (ev.origem === 'porta') setNodoAtivo('porta');
                else if (ev.origem === 'su') setNodoAtivo('su');
                else if (ev.origem === 'consola') setNodoAtivo('consola');
              } catch (_) {}
            };
            es.onerror = () => setConectado(false);
          } catch (_) {}

          return () => {
            if (es) es.close();
          };
        }, []);

        const legendaEvento = useMemo(() => {
          if (!ultimoEvento) return 'Sistema autárquico em operação. Aguarda novas mensagens ou atos de tramitação.';
          const tipo = ultimoEvento.tipo;
          if (tipo === 'canal.mensagem.recebida') return 'Mensagem do requerente registada no canal digital.';
          if (tipo === 'porta.servico.obtido') return 'Consulta certificada à Porta Agêntica com validação de versão.';
          if (tipo === 'henriques.resposta.verificada') return 'Resposta validada contra a fonte regulamentar oficial do Município.';
          if (tipo === 'cofre.item.guardado') return 'Elemento instrutório cifrado com chave AES-256 no Cofre Pessoal.';
          if (tipo === 'mandato.concedido') return 'Mandato eletrónico qualificado D3 formalmente emitido.';
          if (tipo === 'missao.estado.alterado') return `Tramitação avançada: estado ${ultimoEvento.dados?.para || 'em curso'}.`;
          if (tipo === 'su.processo.estado.alterado') return `Gabinete de Espaço Público atualizou o processo: ${ultimoEvento.dados?.para || 'tramitação'}.`;
          if (tipo === 'consola.caso.criado') return 'Novo processo distribuído na consola técnica dos Serviços Urbanos.';
          return `Evento de tramitação auditado: ${tipo}`;
        }, [ultimoEvento]);

        return html`
          <div style=${{ display: 'flex', flexDirection: 'column', height: '100vh', overflow: 'hidden' }}>
            <!-- 1. Cabeçalho Oficial Autárquico -->
            <header class="cmg-header">
              <div class="header-conteudo">
                <div class="logo-area">
                  <img class="logo-guimaraes" src="/assets/logo_guimaraes_branco.png" alt="Município de Guimarães" />
                  <div class="divisor-vertical"></div>
                  <div class="titulos-autarquia">
                    <h1>MUNICÍPIO DE GUIMARÃES</h1>
                    <p>Painel de Atividade · Gestão e Transparência Municipal</p>
                  </div>
                </div>

                <nav class="nav-links-menu">
                  <a href="/" class="nav-item ativo">Painel de Atividade</a>
                  <a href="/consola" class="nav-item">Consola Técnica</a>
                  <a href="https://www.cm-guimaraes.pt" target="_blank" class="nav-item">Portal Autárquico</a>
                  <span class="divisor-menu"></span>
                  <a href="/delegate" class="nav-item destaque-delegate" title="Aceder à plataforma técnica de integração">Plataforma Delegate ↗</a>
                </nav>

                <div class="header-controles">
                  <span class="badge-simulacao">Ambiente de Simulação</span>
                  <div style=${{ display: 'flex', gap: '0.35rem' }}>
                    <button
                      class=${`btn-modo ${!modoTecnico ? 'ativo' : ''}`}
                      onClick=${() => setModoTecnico(false)}
                    >Modo Geral</button>
                    <button
                      class=${`btn-modo ${modoTecnico ? 'ativo' : ''}`}
                      onClick=${() => setModoTecnico(true)}
                    >Modo Auditoria</button>
                  </div>

                  <div class="indicador-ao-vivo">
                    <span class="ponto-vivo" style=${{ background: conectado ? '#27ae60' : '#e67e22' }}></span>
                    <span>${conectado ? 'SISTEMA ATIVO' : 'RECONECTANDO'}</span>
                  </div>
                </div>
              </div>
            </header>

            <!-- 2. Faixa do Facto Auditado Atual -->
            <div class="faixa-facto">
              <div class="facto-legenda">
                <span class="tag-facto">Último Ato</span>
                <span class="facto-texto-destaque">${legendaEvento}</span>
              </div>
              <div>
                <span class="facto-tipo-evento">${ultimoEvento?.tipo || 'barramento.ativo'}</span>
              </div>
            </div>

            <!-- 3. Corpo Principal do Painel de Atividade -->
            <main class="painel-layout">
              <!-- Zona Esquerda: Palco e Grafo de Barramento -->
              <div class="zona-palco-grafo">
                <!-- Palco do Cidadão -->
                <div class="modulo-autarquico" style=${{ flex: 1 }}>
                  <div class="modulo-cabecalho">
                    <h2>Canal de Atendimento ao Cidadão — Atendimento Digital</h2>
                    <span style=${{ fontSize: '11px', color: 'var(--cmg-texto-suave)' }}>
                      Requerente: Maria Lurdes Gonçalves · Casa Joaquim (Largo da Oliveira)
                    </span>
                  </div>
                  <div class="palco-corpo">
                    <div class="linha-dialogo municipe">
                      <span class="dialogo-remetente">Requerente · 10:24</span>
                      <div class="dialogo-balao balao-municipe">
                        Bom dia, tenho o restaurante Casa Joaquim no Largo da Oliveira. Posso colocar 4 mesas de esplanada na calçada em frente ao estabelecimento?
                      </div>
                    </div>

                    <div class="linha-dialogo henriques">
                      <span class="dialogo-remetente" style=${{ textAlign: 'right' }}>Henriques (Representante Digital) · 10:24</span>
                      <div class="dialogo-balao balao-henriques">
                        Bom dia! No Largo da Oliveira, a instalação de esplanada aberta contígua à fachada efetua-se mediante <b>Mera Comunicação Prévia</b> à Câmara Municipal de Guimarães.<br /><br />
                        As regras essenciais a observar são as seguintes:<br />
                        1. Deixar desimpedido um <b>canal pedonal de circulação de pelo menos 2,00 metros</b>;<br />
                        2. Instalar exclusivamente mobiliário amovível sem qualquer fixação ao pavimento histórico;<br />
                        3. A taxa municipal anual é de <b>75,75 €</b> (calculada a 7,50 €/m² para 10 m², nos termos do Art. 42.º do RTTL 2025).<br /><br />
                        Deseja que confirme a conformidade das dimensões e prepare o processo para entrada na autarquia?
                        <div class="caixa-citacao-oficial">
                          <strong>Fontes Verificadas:</strong> Regulamento Municipal de Ocupação do Espaço Público de Guimarães (Reg. n.º 123/2020, Art. 8.º) · RTTL 2025 (Art. 42.º).
                        </div>
                      </div>
                    </div>

                    <div class="linha-dialogo municipe">
                      <span class="dialogo-remetente">Requerente · 10:25</span>
                      <div class="dialogo-balao balao-municipe">
                        Sim, confirmei com fita métrica e tenho 2,10 metros livres de calçada. Autorizo a instruir o pedido no Balcão Único.
                      </div>
                    </div>

                    <div class="linha-dialogo henriques">
                      <span class="dialogo-remetente" style=${{ textAlign: 'right' }}>Henriques (Representante Digital) · 10:26</span>
                      <div class="dialogo-balao balao-henriques">
                        Requisito de circulação validado (2,10 m ≥ 2,00 m). Ao abrigo do <b>Mandato Eletrónico D3</b>, foi instruído e submetido o processo de Mera Comunicação Prévia n.º <b>OEP/2026/0001</b> à Divisão de Gestão do Espaço Público da Câmara Municipal de Guimarães.
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Grafo de Barramento Autárquico -->
                <div class="modulo-autarquico">
                  <div class="modulo-cabecalho">
                    <h2>Barramento de Integração Agêntica</h2>
                    <span style=${{ fontSize: '11px', color: 'var(--cmg-verde)', fontWeight: '700' }}>
                      Processamento em Tempo Real por Eventos
                    </span>
                  </div>
                  <div class="grafo-corpo">
                    <div class=${`nodo-barramento ${nodoAtivo === 'canal' ? 'ativo' : ''}`}>
                      <span class="nodo-protocolo-tag">MTProto / Bot</span>
                      <span class="nodo-titulo-texto">Canal Cidadão</span>
                      <span class="nodo-descricao-texto">Atendimento Direto</span>
                    </div>

                    <div class=${`nodo-barramento ${nodoAtivo === 'henriques' ? 'ativo' : ''}`}>
                      <span class="nodo-protocolo-tag">Orquestrador</span>
                      <span class="nodo-titulo-texto">Henriques</span>
                      <span class="nodo-descricao-texto">Roteador e Agente</span>
                    </div>

                    <div class=${`nodo-barramento ${nodoAtivo === 'politica' ? 'ativo' : ''}`}>
                      <span class="nodo-protocolo-tag">AES-256-GCM</span>
                      <span class="nodo-titulo-texto">Cofre e Mandatos</span>
                      <span class="nodo-descricao-texto">Filtro de Privacidade</span>
                    </div>

                    <div class=${`nodo-barramento ${nodoAtivo === 'porta' ? 'ativo' : ''}`}>
                      <span class="nodo-protocolo-tag">MCP v2 · 4001</span>
                      <span class="nodo-titulo-texto">Entrada de Processos</span>
                      <span class="nodo-descricao-texto">Interoperabilidade MCP</span>
                    </div>

                    <div class=${`nodo-barramento ${nodoAtivo === 'su' ? 'ativo' : ''}`}>
                      <span class="nodo-simulacao-flag">Simulação</span>
                      <span class="nodo-protocolo-tag">SIGMA / OEP</span>
                      <span class="nodo-titulo-texto">Serviços Urbanos</span>
                      <span class="nodo-descricao-texto">Gestão Espaço Público</span>
                    </div>

                    <div class=${`nodo-barramento ${nodoAtivo === 'consola' ? 'ativo' : ''}`}>
                      <span class="nodo-protocolo-tag">Web Autárquica</span>
                      <span class="nodo-titulo-texto">Consola Técnica</span>
                      <span class="nodo-descricao-texto">Apreciação Oficial</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Zona Direita: Procedimento e Armazenamento Local Cifrado -->
              <aside class="zona-lateral-painel">
                <!-- Módulo Procedimento -->
                <div class="modulo-autarquico">
                  <div class="modulo-cabecalho">
                    <h3>Tramitação do Procedimento · MIS-0001</h3>
                  </div>
                  <div style=${{ padding: '0.85rem 1rem 0.25rem 1rem' }}>
                    <div style=${{ fontSize: '13px', fontWeight: 'bold', color: 'var(--cmg-azul-escuro)' }}>
                      Mera Comunicação Prévia de Esplanada Aberta
                    </div>
                    <div style=${{ fontSize: '11.5px', color: 'var(--cmg-texto-suave)', marginTop: '0.15rem' }}>
                      Requerente: Maria Lurdes Gonçalves · Largo da Oliveira, 12
                    </div>
                  </div>
                  <table class="tabela-tramitacao-missao">
                    <tbody>
                      <tr>
                        <td class="missao-etapa-num">01</td>
                        <td class="missao-etapa-desc">Intenção manifestada e triagem regulamentar</td>
                        <td class="missao-etapa-status status-concluido">Concluído</td>
                      </tr>
                      <tr>
                        <td class="missao-etapa-num">02</td>
                        <td class="missao-etapa-desc">Concessão de Mandato Eletrónico D3</td>
                        <td class="missao-etapa-status status-concluido">Autorizado</td>
                      </tr>
                      <tr>
                        <td class="missao-etapa-num">03</td>
                        <td class="missao-etapa-desc">Aferição de corredor pedonal (2,10 m)</td>
                        <td class="missao-etapa-status status-concluido">Conforme</td>
                      </tr>
                      <tr>
                        <td class="missao-etapa-num">04</td>
                        <td class="missao-etapa-desc">Instrução e entrada na Câmara (OEP/2026/0001)</td>
                        <td class="missao-etapa-status status-em-curso">Submetido</td>
                      </tr>
                      <tr>
                        <td class="missao-etapa-num">05</td>
                        <td class="missao-etapa-desc">Apreciação e liquidação da taxa (RTTL 2025)</td>
                        <td class="missao-etapa-status status-pendente">Apreciação</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <!-- Módulo de Armazenamento Local Cifrado -->
                <div class="modulo-autarquico">
                  <div class="modulo-cabecalho">
                    <h3>Armazenamento Local Cifrado</h3>
                    <span style=${{ fontSize: '10.5px', color: 'var(--cmg-azul-medio)', fontFamily: 'var(--font-mono)' }}>
                      AES-256-GCM
                    </span>
                  </div>

                  <div class="camada-cifrada-item">
                    <div class="camada-cifrada-topo">
                      <span class="camada-cifrada-titulo">Camada 1: Intenção Registada</span>
                      <span class="camada-cifrada-pill pill-autorizado">Cifrado Local</span>
                    </div>
                    <div class="camada-cifrada-dados">
                      esplanada_casa_joaquim · 10,00 m² · 4 mesas
                    </div>
                  </div>

                  <div class="camada-cifrada-item">
                    <div class="camada-cifrada-topo">
                      <span class="camada-cifrada-titulo">Camada 2: Pacote Mínimo Transmitido</span>
                      <span class="camada-cifrada-pill pill-autorizado">Mandato D3</span>
                    </div>
                    <div class="camada-cifrada-dados">
                      localizacao: Largo da Oliveira, n.º 12<br />
                      corredor_pedonal_aferido: 2,10 m (≥ 2,00 m)
                    </div>
                  </div>

                  <div class="camada-cifrada-item">
                    <div class="camada-cifrada-topo">
                      <span class="camada-cifrada-titulo">Camada 3: Dados Privados do Cidadão</span>
                      <span class="camada-cifrada-pill pill-privado">Inacessível à Câmara</span>
                    </div>
                    <div class="camada-cifrada-dados" style=${{ color: 'var(--cmg-texto-suave)' }}>
                      dados_patrimoniais · chaves_privadas_locais
                    </div>
                  </div>
                </div>
              </aside>
            </main>

            <!-- 4. Rodapé Oficial de Auditoria de Eventos -->
            <footer class="cmg-auditoria-footer">
              <div class="auditoria-rotulo">Registo de Auditoria SHA-256:</div>
              <div class="auditoria-stream-scroll">
                ${eventos.slice(0, 10).map(
                  (ev, idx) => html`
                    <div key=${idx} class="auditoria-badge-pill">
                      <span class="auditoria-seq">#${eventos.length - idx}</span>
                      <span class="auditoria-tipo">${ev.tipo}</span>
                      <span class="auditoria-hash">${(ev.selo?.hash_evento || ev.hash || 'e739ab6e').substring(0, 8)}</span>
                    </div>
                  `
                )}
              </div>
            </footer>
          </div>
        `;
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(PainelAtividadeApp));
    </script>
  </body>
</html>
