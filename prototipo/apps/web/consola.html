<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consola Municipal · Divisão de Gestão do Espaço Público · Município de Guimarães</title>

    <!-- Favicon e Ícones Oficiais do Município de Guimarães -->
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Tipografia Oficial de cm-guimaraes.pt: Barlow -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Paleta Institucional Autárquica (cm-guimaraes.pt & WireMaze Citizen) */
        --cmg-azul-escuro: #08244c;
        --cmg-azul-medio: #0555b4;
        --cmg-azul-hover: #043c7e;
        --cmg-azul-claro: #e6eef8;
        --cmg-azul-destaque: #cdddf0;

        --cmg-fundo: #edf2f7;
        --cmg-superficie: #ffffff;
        --cmg-borda: #cbd5e1;
        --cmg-borda-escura: #94a3b8;

        --cmg-texto: #0f172a;
        --cmg-texto-secundario: #334155;
        --cmg-texto-suave: #64748b;

        --cmg-verde: #1e7e34;
        --cmg-verde-bg: #edf7ed;
        --cmg-verde-borda: #b7dfb9;

        --cmg-ambar: #b45309;
        --cmg-ambar-bg: #fffbeb;
        --cmg-ambar-borda: #fde68a;

        --cmg-vermelho: #b91c1c;
        --cmg-vermelho-bg: #fef2f2;
        --cmg-vermelho-borda: #fecaca;

        --font-primary: 'Barlow', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-condensed: 'Barlow Condensed', 'Barlow', sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: var(--cmg-fundo);
        color: var(--cmg-texto);
        font-family: var(--font-primary);
        font-size: 13.5px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      /* =========================================================================
         1. CABEÇALHO OFICIAL AUTÁRQUICO (cm-guimaraes.pt)
         ========================================================================= */
      header.cmg-header {
        background: var(--cmg-azul-escuro);
        color: #ffffff;
        border-bottom: 3px solid var(--cmg-azul-medio);
        padding: 0.65rem 1.75rem;
        flex-shrink: 0;
        min-height: 60px;
        display: flex;
        align-items: center;
      }

      .header-conteudo {
        max-width: 1720px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
      }

      .logo-area {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .logo-guimaraes {
        height: 38px;
        width: auto;
        display: block;
      }

      .divisor-vertical {
        height: 28px;
        width: 1px;
        background: rgba(255, 255, 255, 0.22);
      }

      .titulos-autarquia h1 {
        font-family: var(--font-condensed);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #ffffff;
        line-height: 1.15;
      }

      .titulos-autarquia p {
        font-size: 11.5px;
        color: var(--cmg-azul-claro);
        font-weight: 400;
      }

      .nav-links-menu {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .nav-item {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 600;
        padding: 0.45rem 0.85rem;
        border-radius: 3px;
        transition: background 0.15s, color 0.15s;
      }

      .nav-item:hover, .nav-item.ativo {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }

      .nav-item.destaque-delegate {
        background: rgba(112, 187, 134, 0.16);
        border: 1px solid rgba(112, 187, 134, 0.40);
        color: #2f7d4c;
        font-weight: 600;
      }
      .nav-item.destaque-delegate:hover {
        background: rgba(112, 187, 134, 0.28);
        color: #1f5c37;
      }

      .divisor-menu {
        height: 18px;
        width: 1px;
        background: rgba(255, 255, 255, 0.22);
        margin: 0 0.35rem;
      }

      .header-utilizador {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .badge-simulacao {
        background: #fff8e1;
        color: #b78103;
        border: 1px solid #ffe082;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.25rem 0.65rem;
        border-radius: 2px;
      }

      .utilizador-perfil {
        text-align: right;
      }

      .utilizador-nome {
        font-size: 12.5px;
        font-weight: 700;
        color: #ffffff;
      }

      .utilizador-cargo {
        font-size: 11px;
        color: var(--cmg-azul-claro);
      }

      .indicador-conexao {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 11.5px;
        font-weight: 600;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.25);
        padding: 0.25rem 0.6rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .ponto-pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #27ae60;
        box-shadow: 0 0 0 2px rgba(39, 174, 96, 0.3);
      }

      /* =========================================================================
         2. BARRA DE BREADCRUMB E SERVIÇOS
         ========================================================================= */
      .breadCrumb-area {
        background: #ffffff;
        border-bottom: 1px solid var(--cmg-borda);
        padding: 0.55rem 1.75rem;
      }

      .breadCrumb-conteudo {
        max-width: 1720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        min-width: 0;
      }

      .breadcrumb-lista {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        list-style: none;
        font-size: 12px;
        color: var(--cmg-texto-suave);
        min-width: 0;
      }

      .breadcrumb-lista a {
        color: var(--cmg-azul-medio);
        text-decoration: none;
        font-weight: 500;
      }

      .breadcrumb-lista a:hover {
        text-decoration: underline;
      }

      .breadcrumb-separador {
        color: #94a3b8;
      }

      .breadcrumb-atual {
        font-weight: 600;
        color: var(--cmg-texto);
      }

      .barra-atalhos-municipais {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-atalho-svg {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--cmg-azul-escuro);
        text-decoration: none;
        padding: 0.25rem 0.6rem;
        border-radius: 2px;
        border: 1px solid var(--cmg-borda);
        background: #f8fafc;
        transition: all 0.15s;
        min-height: 44px;
      }

      .btn-atalho-svg:hover {
        background: var(--cmg-azul-claro);
        border-color: var(--cmg-azul-destaque);
      }

      .btn-atalho-svg img {
        width: 14px;
        height: 14px;
      }

      /* =========================================================================
         3. POSTO DE TRABALHO MUNICIPAL (Layout Integrado de Tramitação)
         ========================================================================= */
      .area-trabalho-autarquica {
        max-width: 1720px;
        margin: 1rem auto;
        padding: 0 1.75rem;
        display: grid;
        grid-template-columns: 290px 1fr 390px;
        gap: 1.25rem;
        flex: 1;
        width: 100%;
        align-items: start;
      }

      /* Painel Esquerdo: Fila de Processos */
      .painel-lateral-processos {
        background: #ffffff;
        border: 1px solid var(--cmg-borda);
        border-top: 3px solid var(--cmg-azul-escuro);
      }

      .painel-titulo-barra {
        padding: 0.75rem 1rem;
        background: #f8fafc;
        border-bottom: 1px solid var(--cmg-borda);
        font-family: var(--font-condensed);
        font-size: 13.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--cmg-azul-escuro);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .filtros-tramitacao {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: #f1f5f9;
        border-bottom: 1px solid var(--cmg-borda);
        padding: 4px;
        gap: 4px;
      }

      .btn-filtro-aba {
        background: transparent;
        border: none;
        color: var(--cmg-texto-secundario);
        font-family: var(--font-primary);
        font-size: 11px;
        font-weight: 600;
        padding: 0.35rem 0.2rem;
        cursor: pointer;
        text-align: center;
        border-radius: 2px;
        transition: all 0.15s;
      }

      .btn-filtro-aba:hover {
        background: #e2e8f0;
        color: var(--cmg-azul-escuro);
      }

      .btn-filtro-aba.ativo {
        background: var(--cmg-azul-medio);
        color: #ffffff;
      }

      .lista-itens-processo {
        max-height: calc(100vh - 270px);
        overflow-y: auto;
      }

      .proc-item-linha {
        padding: 0.85rem 1rem;
        border-bottom: 1px solid #e2e8f0;
        cursor: pointer;
        transition: background 0.15s;
        background: #ffffff;
      }

      .proc-item-linha:hover {
        background: #f8fafc;
      }

      .proc-item-linha.ativo {
        background: #eef5fc;
        border-left: 4px solid var(--cmg-azul-medio);
        padding-left: calc(1rem - 4px);
      }

      .proc-item-topo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.35rem;
      }

      .proc-item-registo {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--cmg-azul-escuro);
      }

      .proc-item-titulo {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--cmg-texto);
        margin-bottom: 0.3rem;
        line-height: 1.35;
      }

      .proc-item-meta {
        font-size: 11px;
        color: var(--cmg-texto-suave);
      }

      /* Badges Autárquicos Formais (WireMaze Citizen) */
      .item-status-tag {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.15rem 0.45rem;
        border-radius: 2px;
      }

      .item-status-em_apreciacao, .item-status-submetido {
        background: var(--cmg-azul-claro);
        color: var(--cmg-azul-medio);
        border: 1px solid var(--cmg-azul-destaque);
      }

      .item-status-pedido_elementos {
        background: var(--cmg-ambar-bg);
        color: var(--cmg-ambar);
        border: 1px solid var(--cmg-ambar-borda);
      }

      .item-status-aceite {
        background: var(--cmg-verde-bg);
        color: var(--cmg-verde);
        border: 1px solid var(--cmg-verde-borda);
      }

      .item-status-rejeitado {
        background: var(--cmg-vermelho-bg);
        color: var(--cmg-vermelho);
        border: 1px solid var(--cmg-vermelho-borda);
      }

      /* =========================================================================
         4. CORPO DO AUTO DE PROCESSO (Dossiê Administrativo .wire_paper)
         ========================================================================= */
      .wire-paper-dossie {
        background: #ffffff;
        border: 1px solid var(--cmg-borda);
        border-top: 3px solid var(--cmg-azul-medio);
      }

      .dossie-cabecalho-oficial {
        padding: 1.25rem 1.5rem 1rem 1.5rem;
        border-bottom: 1px solid var(--cmg-borda);
        background: #ffffff;
      }

      .dossie-entidade {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.5rem;
      }

      .dossie-entidade-texto {
        font-family: var(--font-condensed);
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--cmg-texto-suave);
      }

      .dossie-titulo-principal {
        font-size: 19px;
        font-weight: 700;
        color: var(--cmg-azul-escuro);
        margin-bottom: 0.4rem;
        line-height: 1.25;
      }

      .dossie-meta-barra {
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        font-size: 12px;
        color: var(--cmg-texto-secundario);
        padding-top: 0.5rem;
        border-top: 1px dashed var(--cmg-borda);
      }

      .dossie-meta-item strong {
        color: var(--cmg-texto);
      }

      .dossie-meta-item code {
        font-family: var(--font-mono);
        font-size: 11px;
        background: var(--cmg-azul-claro);
        color: var(--cmg-azul-escuro);
        padding: 0.1rem 0.35rem;
        border-radius: 2px;
      }

      .dossie-seccoes {
        padding: 1.25rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      /* Bloco de Informação Técnica Autárquica */
      .bloco-informacao-tecnica {
        border: 1px solid var(--cmg-borda);
        background: #ffffff;
      }

      .bloco-informacao-header {
        background: #f8fafc;
        border-bottom: 1px solid var(--cmg-borda);
        padding: 0.65rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .bloco-informacao-header h3 {
        font-family: var(--font-condensed);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--cmg-azul-escuro);
      }

      .bloco-informacao-corpo {
        padding: 1rem;
        font-size: 13px;
        line-height: 1.55;
        color: var(--cmg-texto);
      }

      .bloco-informacao-corpo p {
        margin-bottom: 0.65rem;
      }

      .bloco-informacao-corpo p:last-child {
        margin-bottom: 0;
      }

      /* Tabelas Formais Autárquicas (.table) */
      .tabela-autarquica {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
        border: 1px solid var(--cmg-borda);
      }

      .tabela-autarquica thead th {
        background: var(--cmg-azul-escuro);
        color: #ffffff;
        font-family: var(--font-condensed);
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.55rem 0.85rem;
        text-align: left;
        border: 1px solid var(--cmg-azul-escuro);
      }

      .tabela-autarquica tbody td {
        padding: 0.65rem 0.85rem;
        border: 1px solid #e2e8f0;
        vertical-align: middle;
      }

      .tabela-autarquica tbody tr:nth-child(even) td {
        background-color: #f8fafc;
      }

      .tabela-col-parametro {
        font-weight: 600;
        color: var(--cmg-texto-secundario);
        width: 32%;
      }

      .tabela-col-valor {
        font-weight: 500;
        color: var(--cmg-texto);
      }

      .tabela-col-criterio {
        font-size: 11.5px;
        color: var(--cmg-texto-suave);
      }

      .tabela-col-estado {
        text-align: right;
        white-space: nowrap;
      }

      .tag-conforme {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--cmg-verde);
        background: var(--cmg-verde-bg);
        border: 1px solid var(--cmg-verde-borda);
        padding: 0.15rem 0.45rem;
        border-radius: 2px;
      }

      .tag-pendente {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--cmg-ambar);
        background: var(--cmg-ambar-bg);
        border: 1px solid var(--cmg-ambar-borda);
        padding: 0.15rem 0.45rem;
        border-radius: 2px;
      }

      /* Tabela de Normas e Regulamentos */
      .lista-normas-tabela {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        border: 1px solid var(--cmg-borda);
      }

      .lista-normas-tabela thead th {
        background: #f1f5f9;
        color: var(--cmg-azul-escuro);
        font-family: var(--font-condensed);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.5rem 0.75rem;
        text-align: left;
        border-bottom: 1px solid var(--cmg-borda);
      }

      .lista-normas-tabela tbody td {
        padding: 0.55rem 0.75rem;
        border-bottom: 1px solid #e2e8f0;
      }

      .norma-codigo {
        font-family: var(--font-mono);
        font-weight: 600;
        color: var(--cmg-azul-medio);
        font-size: 11px;
      }

      .norma-versao {
        font-family: var(--font-mono);
        color: var(--cmg-texto-suave);
        font-size: 10.5px;
      }

      /* =========================================================================
         5. PAINEL DE DESPACHO E ATOS TÉCNICOS (Direita)
         ========================================================================= */
      .painel-despacho-atos {
        background: #ffffff;
        border: 1px solid var(--cmg-borda);
        border-top: 3px solid var(--cmg-azul-escuro);
      }

      .despacho-formulario {
        padding: 1rem 1.15rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .grupo-campo-despacho {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .label-despacho {
        font-size: 12px;
        font-weight: 700;
        color: var(--cmg-azul-escuro);
      }

      .textarea-despacho {
        width: 100%;
        border: 1px solid var(--cmg-borda-escura);
        border-radius: 2px;
        padding: 0.65rem;
        font-family: var(--font-primary);
        font-size: 12.5px;
        line-height: 1.45;
        color: var(--cmg-texto);
        background: #ffffff;
        min-height: 95px;
        resize: vertical;
      }

      .textarea-despacho:focus {
        outline: none;
        border-color: var(--cmg-azul-medio);
        box-shadow: 0 0 0 1px var(--cmg-azul-medio);
      }

      /* Botões Autárquicos Formais (.RenderFormActions / cm-guimaraes.pt) */
      .botoes-atos-administrativos {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .btn-ato-autarquico {
        width: 100%;
        padding: 0.65rem 0.85rem;
        font-family: var(--font-primary);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 2px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        transition: background 0.15s, border-color 0.15s;
      }

      .btn-ato-titulo {
        font-weight: 700;
      }

      .btn-ato-sub {
        font-size: 10.5px;
        font-weight: 400;
        opacity: 0.85;
      }

      .btn-ato-deferir {
        background: var(--cmg-azul-medio);
        color: #ffffff;
        border: 1px solid var(--cmg-azul-escuro);
      }

      .btn-ato-deferir:hover {
        background: var(--cmg-azul-hover);
      }

      .btn-ato-notificar {
        background: #ffffff;
        color: var(--cmg-ambar);
        border: 1px solid #f59e0b;
      }

      .btn-ato-notificar:hover {
        background: var(--cmg-ambar-bg);
      }

      .btn-ato-indeferir {
        background: #ffffff;
        color: var(--cmg-vermelho);
        border: 1px solid var(--cmg-vermelho);
      }

      .btn-ato-indeferir:hover {
        background: var(--cmg-vermelho-bg);
      }

      .notificacao-sucesso-ato {
        background: var(--cmg-verde-bg);
        border: 1px solid var(--cmg-verde-borda);
        color: var(--cmg-verde);
        padding: 0.65rem 0.85rem;
        font-size: 12px;
        font-weight: 600;
        border-radius: 2px;
      }

      /* Livro de Tramitação Oficial */
      .livro-tramitacao-area {
        border-top: 1px solid var(--cmg-borda);
        padding-top: 0.85rem;
      }

      .livro-tramitacao-titulo {
        font-family: var(--font-condensed);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--cmg-azul-escuro);
        margin-bottom: 0.65rem;
      }

      .lista-atos-tramitacao {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .registo-ato-item {
        border-left: 2px solid var(--cmg-azul-medio);
        padding-left: 0.65rem;
        font-size: 11.5px;
      }

      .registo-ato-data {
        color: var(--cmg-texto-suave);
        font-size: 10.5px;
      }

      .registo-ato-transicao {
        font-weight: 700;
        color: var(--cmg-azul-escuro);
      }

      .registo-ato-fundamento {
        color: var(--cmg-texto-secundario);
        margin-top: 0.15rem;
        line-height: 1.35;
      }

      /* =========================================================================
         6. RODAPÉ AUTÁRQUICO INSTITUCIONAL
         ========================================================================= */
      footer.cmg-footer {
        background: #ffffff;
        border-top: 1px solid var(--cmg-borda);
        padding: 0.85rem 1.75rem;
        color: var(--cmg-texto-suave);
        font-size: 11.5px;
        flex-shrink: 0;
        margin-top: 1.5rem;
      }

      .footer-conteudo {
        max-width: 1720px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Visibilidade de foco: o teclado tem de ver onde está. */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--cmg-azul-medio);
        outline-offset: 2px;
        border-radius: 2px;
      }

      /* Alvos de toque: mínimo ~44px. */
      .nav-item { min-height: 44px; display: inline-flex; align-items: center; }
      .btn-filtro-aba { min-height: 44px; }
      .breadcrumb-lista a { min-height: 44px; display: inline-flex; align-items: center; }

      /* Movimento reduzido: mantém o feedback de estado, remove o movimento. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ---- Responsivo ----
         A navegação e a grelha de três colunas tinham largura fixa e
         empurravam o documento na horizontal em ecrãs estreitos. */
      @media (max-width: 1200px) {
        /* minmax(0,1fr) e não 1fr: sem o zero, a coluna não encolhe abaixo do
           conteúdo mínimo e volta a empurrar o documento na horizontal. */
        .area-trabalho-autarquica { grid-template-columns: minmax(0, 1fr); padding: 0 1.25rem; }
        .lista-itens-processo { max-height: 320px; }
      }

      @media (max-width: 900px) {
        .nav-links-menu { flex-wrap: wrap; min-width: 0; gap: 0.25rem; }
        .cmg-header { padding-left: 1.25rem; padding-right: 1.25rem; }
        .header-conteudo { flex-wrap: wrap; gap: 0.75rem; }
      }

      @media (max-width: 640px) {
        .nav-links-menu { flex-direction: column; align-items: stretch; width: 100%; }
        .nav-item { justify-content: flex-start; }
        .barra-atalhos-municipais { flex-wrap: wrap; min-width: 0; }
        .btn-atalho-svg { min-height: 44px; padding: 0.35rem 0.5rem; }
        .filtros-tramitacao { grid-template-columns: repeat(2, 1fr); }
        .cmg-footer { padding: 0.85rem 1.25rem; }
        .footer-conteudo { flex-direction: column; gap: 0.5rem; text-align: center; }
        /* Tabelas de dados: scroll controlado em vez de transbordo da página. */
        table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Carregamento Modular de React 18 e HTM via CDN ESM Seguro -->
    <script type="module">
      import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.3.1';
      import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';
      import htm from 'https://esm.sh/htm@3.1.1';

      const html = htm.bind(React.createElement);
      const PORTA_API = 'http://localhost:4001';

      function ConsolaMunicipalApp() {
        const [processos, setProcessos] = useState([]);
        const [processoAtivoId, setProcessoAtivoId] = useState('OEP/2026/0001');
        const [filtro, setFiltro] = useState('todos');
        const [fundamento, setFundamento] = useState(
          'Nos termos do artigo 117.º do Código do Procedimento Administrativo, notifica-se o requerente para apresentar a confirmação cadastral da largura da fachada contígua à esplanada requerida.'
        );
        const [mensagemSucesso, setMensagemSucesso] = useState(null);
        const [conectadoSSE, setConectadoSSE] = useState(true);

        const carregarProcessos = async () => {
          try {
            const resp = await fetch(`${PORTA_API}/processos`);
            if (!resp.ok) return;
            const dados = await resp.json();
            setProcessos(dados);
          } catch (e) {
            console.warn('Aguardando servidor de processos:', e);
          }
        };

        useEffect(() => {
          carregarProcessos();
          const intervalo = setInterval(carregarProcessos, 3500);

          let es = null;
          try {
            es = new EventSource('/eventos/stream');
            es.onopen = () => setConectadoSSE(true);
            es.onmessage = (msg) => {
              try {
                const ev = JSON.parse(msg.data);
                if (ev.origem === 'su' || ev.origem === 'consola' || ev.origem === 'orquestrador') {
                  carregarProcessos();
                }
              } catch (_) {}
            };
            es.onerror = () => setConectadoSSE(false);
          } catch (_) {}

          return () => {
            clearInterval(intervalo);
            if (es) es.close();
          };
        }, []);

        const processoAtivo = useMemo(() => {
          return processos.find((p) => p.numero === processoAtivoId) || processos[0] || null;
        }, [processos, processoAtivoId]);

        const processosFiltrados = useMemo(() => {
          if (filtro === 'todos') return processos;
          return processos.filter((p) => p.estado === filtro);
        }, [processos, filtro]);

        useEffect(() => {
          if (!processoAtivo) return;
          const isPip = processoAtivo.numero.startsWith('PIP') || processoAtivo.servico?.includes('urbanismo');
          if (processoAtivo.estado === 'pedido_elementos') {
            setFundamento(
              isPip
                ? 'Notifica-se o requerente para junção de levantamento topográfico georreferenciado e corte altimétrico nos termos do artigo 117.º do CPA.'
                : 'Processo a aguardar resposta à notificação de aperfeiçoamento nos termos do artigo 117.º do CPA.'
            );
          } else if (processoAtivo.estado === 'aceite') {
            setFundamento(
              isPip
                ? `Pedido de Informação Prévia favorável vinculativo pelo período de 1 ano (Art. 16.º RJUE). Taxa liquidada: ${processoAtivo.taxa_calculada?.valor ?? 52.50} €.`
                : `Mera Comunicação Prévia deferida nos termos do RJACSR. Taxa liquidada: ${processoAtivo.taxa_calculada?.valor ?? 75.75} € ao abrigo do Art. 42.º do RTTL 2025. Emitido título digital.`
            );
          } else {
            setFundamento(
              isPip
                ? 'Verificada a conformidade com os parâmetros do PDM (Solo Urbano · Espaço Residencial Nível 2), propõe-se a emissão de informação prévia favorável vinculativa ao abrigo do Art. 16.º do RJUE.'
                : 'Nos termos do artigo 117.º do Código do Procedimento Administrativo, notifica-se o requerente para apresentar a confirmação cadastral da largura da fachada contígua à esplanada requerida.'
            );
          }
        }, [processoAtivo?.estado, processoAtivo?.numero]);

        const executarDespacho = async (acao, elemento) => {
          if (!processoAtivo) return;
          const isPip = processoAtivo.numero.startsWith('PIP') || processoAtivo.servico?.includes('urbanismo');
          try {
            const res = await fetch(`${PORTA_API}/processos/${encodeURIComponent(processoAtivo.numero)}/decisao`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ acao, elemento: isPip ? 'levantamento_topografico' : elemento, fundamento }),
            });
            if (!res.ok) throw new Error('Falha ao registar ato administrativo');
            const atualizado = await res.json();

            if (acao === 'pedir_elementos') {
              setMensagemSucesso('Ato registado: Notificação de aperfeiçoamento expedida para o requerente via mandatário digital.');
            } else if (acao === 'aceitar') {
              setMensagemSucesso(
                isPip
                  ? `Ato registado: Pedido de Informação Prévia deferido favoravelmente. Guia emitida: ${atualizado.taxa_calculada?.valor ?? 52.50} €.`
                  : `Ato registado: Mera Comunicação Prévia deferida. Guia de taxa emitida no valor de ${atualizado.taxa_calculada?.valor ?? 75.75} €.`
              );
            } else {
              setMensagemSucesso('Ato registado: Projeto de indeferimento fundamentado registado na tramitação.');
            }

            await carregarProcessos();
            setTimeout(() => setMensagemSucesso(null), 6000);
          } catch (err) {
            alert('Erro no registo do ato administrativo: ' + err.message);
          }
        };

        const nomesEstados = {
          em_apreciacao: 'Em Apreciação',
          pedido_elementos: 'Aguarda Elementos',
          aceite: 'Deferido',
          submetido: 'Submetido',
          rejeitado: 'Indeferido',
          rascunho: 'Rascunho',
        };

        const isPipAtivo = processoAtivo?.numero?.startsWith('PIP') || processoAtivo?.servico?.includes('urbanismo');

        return html`
          <div style=${{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
            <!-- 1. Cabeçalho Oficial Autárquico -->
            <header class="cmg-header">
              <div class="header-conteudo">
                <div class="logo-area">
                  <img class="logo-guimaraes" src="/assets/logo_guimaraes_branco.png" alt="Município de Guimarães" />
                  <div class="divisor-vertical"></div>
                  <div class="titulos-autarquia">
                    <h1>MUNICÍPIO DE GUIMARÃES</h1>
                    <p>Consola Técnica · ${isPipAtivo ? 'Divisão de Gestão Urbanística' : 'Divisão de Gestão do Espaço Público'}</p>
                  </div>
                </div>

                <nav class="nav-links-menu">
                  <a href="/" class="nav-item">Painel de Atividade</a>
                  <a href="/consola" class="nav-item ativo">Consola Técnica</a>
                  <a href="https://www.cm-guimaraes.pt" target="_blank" class="nav-item">Portal Autárquico</a>
                  <span class="divisor-menu"></span>
                  <a href="/delegate" class="nav-item destaque-delegate" title="Aceder à plataforma técnica de integração">Plataforma Delegate ↗</a>
                </nav>

                <div class="header-utilizador">
                  <span class="badge-simulacao">Ambiente de Simulação</span>
                  <div class="utilizador-perfil">
                    <div class="utilizador-nome">Eng.ª Sónia Martins</div>
                    <div class="utilizador-cargo">Técnica Superior · ${isPipAtivo ? 'Divisão de Gestão Urbanística' : 'Divisão de Espaço Público'}</div>
                  </div>
                  <div class="indicador-conexao">
                    <span class="ponto-pulse" style=${{ background: conectadoSSE ? '#27ae60' : '#e67e22' }}></span>
                    <span>${conectadoSSE ? 'Sessão Ativa' : 'A ligar...'}</span>
                  </div>
                </div>
              </div>
            </header>

            <!-- 2. Barra de Breadcrumb e Atalhos Cívicos -->
            <div class="breadCrumb-area">
              <div class="breadCrumb-conteudo">
                <ul class="breadcrumb-lista">
                  <li><a href="/">Início</a></li>
                  <li class="breadcrumb-separador">/</li>
                  <li><a href="/consola">${isPipAtivo ? 'Urbanismo e Ordenamento' : 'Serviços Urbanos e Mobilidade'}</a></li>
                  <li class="breadcrumb-separador">/</li>
                  <li>${isPipAtivo ? 'Informação Prévia (PDM)' : 'Ocupação do Espaço Público'}</li>
                  <li class="breadcrumb-separador">/</li>
                  <li class="breadcrumb-atual">Processo ${processoAtivo?.numero || 'OEP/2026/0001'}</li>
                </ul>

                <div class="barra-atalhos-municipais">
                  <a href="#" class="btn-atalho-svg" title="Serviços Online">
                    <img src="/assets/icon_servicos.svg" alt="" />
                    <span>Serviços Online</span>
                  </a>
                  <a href="#" class="btn-atalho-svg" title="Registo de Ocorrências">
                    <img src="/assets/icon_ocorrencias.svg" alt="" />
                    <span>Ocorrências</span>
                  </a>
                  <a href="#" class="btn-atalho-svg" title="Balcão Único Municipal">
                    <img src="/assets/icon_contactos_novo.svg" alt="" />
                    <span>Balcão Único</span>
                  </a>
                </div>
              </div>
            </div>

            <!-- 3. Posto de Trabalho Municipal (Layout de 3 Colunas Autárquico) -->
            <main class="area-trabalho-autarquica">
              <!-- Coluna 1: Índice de Processos Pendentes -->
              <aside class="painel-lateral-processos">
                <div class="painel-titulo-barra">
                  <span>Índice de Processos</span>
                  <span style=${{ fontSize: '11px', color: 'var(--cmg-texto-suave)' }}>${processos.length} no total</span>
                </div>

                <div class="filtros-tramitacao">
                  <button
                    class=${`btn-filtro-aba ${filtro === 'todos' ? 'ativo' : ''}`}
                    onClick=${() => setFiltro('todos')}
                  >Todos</button>
                  <button
                    class=${`btn-filtro-aba ${filtro === 'em_apreciacao' ? 'ativo' : ''}`}
                    onClick=${() => setFiltro('em_apreciacao')}
                  >Apreciação</button>
                  <button
                    class=${`btn-filtro-aba ${filtro === 'pedido_elementos' ? 'ativo' : ''}`}
                    onClick=${() => setFiltro('pedido_elementos')}
                  >Pendentes</button>
                  <button
                    class=${`btn-filtro-aba ${filtro === 'aceite' ? 'ativo' : ''}`}
                    onClick=${() => setFiltro('aceite')}
                  >Deferidos</button>
                </div>

                <div class="lista-itens-processo">
                  ${processosFiltrados.length === 0
                    ? html`<div style=${{ padding: '1.5rem', textAlign: 'center', color: '#64748b', fontSize: '12px' }}>
                        Não existem processos no estado selecionado.
                      </div>`
                    : processosFiltrados.map(
                        (p) => html`
                          <div
                            key=${p.numero}
                            class=${`proc-item-linha ${processoAtivo?.numero === p.numero ? 'ativo' : ''}`}
                            onClick=${() => setProcessoAtivoId(p.numero)}
                          >
                            <div class="proc-item-topo">
                              <span class="proc-item-registo">${p.numero}</span>
                              <span class=${`item-status-tag item-status-${p.estado}`}>
                                ${nomesEstados[p.estado] || p.estado}
                              </span>
                            </div>
                            <div class="proc-item-titulo">${p.servicoTitulo}</div>
                            <div class="proc-item-meta">
                              Titular: ${p.pessoa}
                            </div>
                          </div>
                        `
                      )}
                </div>
              </aside>

              <!-- Coluna 2: Auto do Processo Administrativo (.wire-paper-dossie) -->
              <section class="wire-paper-dossie">
                ${processoAtivo
                  ? html`
                      <!-- Cabeçalho Oficial do Auto -->
                      <div class="dossie-cabecalho-oficial">
                        <div class="dossie-entidade">
                          <span class="dossie-entidade-texto">Município de Guimarães · ${isPipAtivo ? 'Divisão de Gestão Urbanística' : 'Balcão do Empreendedor'}</span>
                          <span class=${`item-status-tag item-status-${processoAtivo.estado}`}>
                            ${nomesEstados[processoAtivo.estado] || 'Em Apreciação'}
                          </span>
                        </div>
                        <h2 class="dossie-titulo-principal">${processoAtivo.servicoTitulo}</h2>
                        <div class="dossie-meta-barra">
                          <div class="dossie-meta-item">N.º de Registo: <code>${processoAtivo.numero}</code></div>
                          <div class="dossie-meta-item">Requerente: <strong>Maria Lurdes Gonçalves</strong></div>
                          <div class="dossie-meta-item">Imóvel: <strong>${processoAtivo.dados?.localizacao || 'Guimarães'}</strong></div>
                          <div class="dossie-meta-item">Data de Entrada: <strong>${processoAtivo.criadoEm?.split('T')[0] || '2026-10-19'}</strong></div>
                        </div>
                      </div>

                      <div class="dossie-seccoes">
                        <!-- Seção 1: Informação Técnica Preliminar de Admissibilidade -->
                        <div class="bloco-informacao-tecnica">
                          <div class="bloco-informacao-header">
                            <h3>1. Informação Técnica de Admissibilidade (${isPipAtivo ? 'Art. 14.º do RJUE' : 'Art. 12.º do RJACSR'})</h3>
                            <span style=${{ fontSize: '11px', color: 'var(--cmg-texto-suave)', fontFamily: 'var(--font-mono)' }}>${isPipAtivo ? 'Inf. 89/2026/DGU' : 'Inf. 142/2026/DGEP'}</span>
                          </div>
                          <div class="bloco-informacao-corpo">
                            ${isPipAtivo
                              ? html`
                                  <p>
                                    Trata-se de Pedido de Informação Prévia (PIP) para apreciação da viabilidade de construção de moradia unifamiliar no terreno sito em <b>${processoAtivo.dados?.localizacao}</b> (${processoAtivo.dados?.coordenadas || 'Silvares'}). A instrução foi promovida sob Mandato Digital qualificado D3 com assinatura eletrónica Chave Móvel Digital.
                                  </p>
                                  <p>
                                    A consulta cadastral ao Plano Diretor Municipal (PDM de Guimarães) enquadra o prédio em <b>Solo Urbano — Espaço Residencial Nível 2</b>, não constando servidões administrativas impeditivas (RAN ou REN). A caderneta predial anexa encontra-se auditada com hash SHA-256 no Cofre Digital.
                                  </p>
                                `
                              : html`
                                  <p>
                                    Trata-se de Mera Comunicação Prévia para instalação de esplanada aberta contígua à fachada da <b>Casa Joaquim</b>, sita no <b>${processoAtivo.dados?.localizacao}</b>. A instrução foi promovida sob mandato eletrónico qualificado, reunindo o pacote mínimo instrutório obrigatório.
                                  </p>
                                  <p>
                                    A verificação técnica preliminar dos elementos fotográficos com escala métrica afere um corredor pedonal livre de circulação de <b>${processoAtivo.dados?.largura_corredor_m ?? 2.10} metros</b>, salvaguardando a circulação pedonal acessível no Largo da Oliveira em conformidade com o limite mínimo regulamentar de 2,00 metros (art. 8.º, n.º 2 do Regulamento Municipal n.º 123/2020).
                                  </p>
                                `}
                          </div>
                        </div>

                        <!-- Seção 2: Quadro Resumo de Parâmetros Urbanísticos Instrutórios -->
                        <div class="bloco-informacao-tecnica">
                          <div class="bloco-informacao-header">
                            <h3>2. Quadro Resumo dos Parâmetros Urbanísticos e Elementos Instrutórios</h3>
                            <span style=${{ fontSize: '11px', color: 'var(--cmg-azul-medio)', fontWeight: '600' }}>Registo Cadastral</span>
                          </div>
                          <table class="tabela-autarquica">
                            <thead>
                              <tr>
                                <th>Parâmetro / Elemento Instrutório</th>
                                <th>Elemento Declarado</th>
                                <th>Enquadramento Regulamentar</th>
                                <th style=${{ textAlign: 'right' }}>Conformidade</th>
                              </tr>
                            </thead>
                            <tbody>
                              ${isPipAtivo
                                ? html`
                                    <tr>
                                      <td class="tabela-col-parametro">Localização do Prédio</td>
                                      <td class="tabela-col-valor">${processoAtivo.dados?.localizacao} (${processoAtivo.dados?.coordenadas || '41.4425, -8.2918'})</td>
                                      <td class="tabela-col-criterio">Solo Urbano · Espaço Residencial Nível 2</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Regular</span></td>
                                    </tr>
                                    <tr>
                                      <td class="tabela-col-parametro">Pretensão Edificatória</td>
                                      <td class="tabela-col-valor">${processoAtivo.dados?.pretensao || 'Construção de Moradia Unifamiliar'}</td>
                                      <td class="tabela-col-criterio">Art. 45.º do Regulamento do PDM</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Conforme</span></td>
                                    </tr>
                                    <tr>
                                      <td class="tabela-col-parametro">Índice de Utilização do Solo</td>
                                      <td class="tabela-col-valor">Declarado ~0.34 (Área bruta ~220 m²)</td>
                                      <td class="tabela-col-criterio">Máximo regulamentar: 0.60 (Art. 45.º PDM)</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Aprovado</span></td>
                                    </tr>
                                    <tr>
                                      <td class="tabela-col-parametro">Cércea Máxima Admissível</td>
                                      <td class="tabela-col-valor" style=${{ color: 'var(--cmg-verde)', fontWeight: '700' }}>2 pisos</td>
                                      <td class="tabela-col-criterio">Art. 47.º do PDM (Limite: até 3 pisos)</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Aprovado</span></td>
                                    </tr>
                                    <tr>
                                      <td class="tabela-col-parametro">Caderneta Predial (Cofre Digital)</td>
                                      <td class="tabela-col-valor" style=${{ color: 'var(--cmg-azul-medio)', fontWeight: '700' }}>Ficheiro PDF verificado (SHA-256)</td>
                                      <td class="tabela-col-criterio">Art. 14.º do RJUE (Legitimidade do requerente)</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Verificado</span></td>
                                    </tr>
                                  `
                                : html`
                                    <tr>
                                      <td class="tabela-col-parametro">Localização da Instalação</td>
                                      <td class="tabela-col-valor">${processoAtivo.dados?.localizacao || 'Largo da Oliveira, n.º 12'}</td>
                                      <td class="tabela-col-criterio">Centro Histórico · Área Classificada</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Regular</span></td>
                                    </tr>
                                    <tr>
                                      <td class="tabela-col-parametro">Área Total de Ocupação</td>
                                      <td class="tabela-col-valor">${processoAtivo.dados?.area_m2} m²</td>
                                      <td class="tabela-col-criterio">Art. 6.º do Reg. Municipal (dimensão máxima admissível)</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Conforme</span></td>
                                    </tr>
                                    <tr>
                                      <td class="tabela-col-parametro">Lotação e Mobiliário Exterior</td>
                                      <td class="tabela-col-valor">${processoAtivo.dados?.numero_mesas} mesas (16 lugares amovíveis)</td>
                                      <td class="tabela-col-criterio">Art. 7.º (Sem fixação ao pavimento)</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Conforme</span></td>
                                    </tr>
                                    <tr>
                                      <td class="tabela-col-parametro">Canal de Circulação Pedonal</td>
                                      <td class="tabela-col-valor" style=${{ color: 'var(--cmg-verde)', fontWeight: '700' }}>
                                        ${processoAtivo.dados?.largura_corredor_m ?? 2.10} metros
                                      </td>
                                      <td class="tabela-col-criterio">Art. 8.º, n.º 2 do Reg. n.º 123/2020 (Exigência ≥ 2,00 m)</td>
                                      <td class="tabela-col-estado"><span class="tag-conforme">Aprovado</span></td>
                                    </tr>
                                    ${processoAtivo.dados?.largura_fachada_m
                                      ? html`
                                          <tr>
                                            <td class="tabela-col-parametro">Largura da Fachada Cadastrada</td>
                                            <td class="tabela-col-valor" style=${{ color: 'var(--cmg-azul-medio)', fontWeight: '700' }}>
                                              ${processoAtivo.dados.largura_fachada_m} metros
                                            </td>
                                            <td class="tabela-col-criterio">Elemento complementar prestado nos termos do CPA</td>
                                            <td class="tabela-col-estado"><span class="tag-conforme">Verificado</span></td>
                                          </tr>
                                        `
                                      : html`
                                          <tr>
                                            <td class="tabela-col-parametro">Largura da Fachada Cadastrada</td>
                                            <td class="tabela-col-valor" style=${{ color: 'var(--cmg-texto-suave)' }}>
                                              Pendente de confirmação do requerente
                                            </td>
                                            <td class="tabela-col-criterio">Notificação nos termos do art. 117.º do CPA</td>
                                            <td class="tabela-col-estado"><span class="tag-pendente">Aguardado</span></td>
                                          </tr>
                                        `}
                                  `}
                            </tbody>
                          </table>
                        </div>

                        <!-- Seção 3: Enquadramento Normativo e Liquidação de Taxas -->
                        <div class="bloco-informacao-tecnica">
                          <div class="bloco-informacao-header">
                            <h3>3. Enquadramento Normativo e Taxas Municipais (RTTL 2025)</h3>
                            <span style=${{ fontSize: '11px', color: 'var(--cmg-azul-medio)', fontFamily: 'var(--font-mono)' }}>Regulamentos Municipais em Vigor</span>
                          </div>
                          <table class="lista-normas-tabela">
                            <thead>
                              <tr>
                                <th>Diploma / Norma Oficial</th>
                                <th>Designação do Ato Normativo</th>
                                <th>Versão Oficial</th>
                                <th style=${{ textAlign: 'right' }}>Taxa Prevista</th>
                              </tr>
                            </thead>
                            <tbody>
                              ${isPipAtivo
                                ? html`
                                    <tr>
                                      <td class="norma-codigo">Aviso n.º 23214/2020</td>
                                      <td>Regulamento do Plano Diretor Municipal de Guimarães (Espaço Residencial Nível 2)</td>
                                      <td class="norma-versao">2020.1</td>
                                      <td style=${{ textAlign: 'right', fontWeight: '600' }}>—</td>
                                    </tr>
                                    <tr>
                                      <td class="norma-codigo">RTTL 2025 · Art. 28.º</td>
                                      <td>Emissão de Certidão de Informação Prévia Vinculativa (Urbanismo)</td>
                                      <td class="norma-versao">2025.1</td>
                                      <td style=${{ textAlign: 'right', fontWeight: '700', color: 'var(--cmg-azul-escuro)' }}>
                                        ${processoAtivo.taxa_calculada?.valor ?? 52.50} €
                                      </td>
                                    </tr>
                                    <tr>
                                      <td class="norma-codigo">D.L. n.º 555/99</td>
                                      <td>Regime Jurídico da Urbanização e Edificação (RJUE · Art. 14.º)</td>
                                      <td class="norma-versao">D.L. 10/2024</td>
                                      <td style=${{ textAlign: 'right', fontWeight: '600' }}>—</td>
                                    </tr>
                                  `
                                : html`
                                    <tr>
                                      <td class="norma-codigo">Reg. n.º 123/2020</td>
                                      <td>Regulamento Municipal de Ocupação do Espaço Público e Publicidade de Guimarães (Art. 8.º)</td>
                                      <td class="norma-versao">2026-10-18.1</td>
                                      <td style=${{ textAlign: 'right', fontWeight: '600' }}>—</td>
                                    </tr>
                                    <tr>
                                      <td class="norma-codigo">RTTL 2025 · Art. 42.º</td>
                                      <td>Tabela de Taxas e Licenças do Município de Guimarães (Esplanadas abertas: 7,50 €/m²/ano)</td>
                                      <td class="norma-versao">2025.1</td>
                                      <td style=${{ textAlign: 'right', fontWeight: '700', color: 'var(--cmg-azul-escuro)' }}>
                                        ${processoAtivo.taxa_calculada?.valor ?? 75.75} €
                                      </td>
                                    </tr>
                                    <tr>
                                      <td class="norma-codigo">D.L. n.º 10/2015</td>
                                      <td>Regime Jurídico de Acesso e Exercício de Atividades de Comércio, Serviços e Restauração (RJACSR)</td>
                                      <td class="norma-versao">Consolidado</td>
                                      <td style=${{ textAlign: 'right', fontWeight: '600' }}>—</td>
                                    </tr>
                                  `}
                            </tbody>
                          </table>
                        </div>

                        <!-- Seção 4: Proposta da Instrução Técnica -->
                        <div class="bloco-informacao-tecnica" style=${{ borderLeft: '3px solid var(--cmg-azul-medio)' }}>
                          <div class="bloco-informacao-header" style=${{ background: '#f0f6ff' }}>
                            <h3 style=${{ color: 'var(--cmg-azul-escuro)' }}>4. Proposta de Decisão da Instrução</h3>
                          </div>
                          <div class="bloco-informacao-corpo">
                            <p style=${{ fontSize: '12.5px', color: 'var(--cmg-texto)' }}>
                              ${processoAtivo.proposta_ia || (isPipAtivo
                                ? 'Verificada a viabilidade urbanística prévia no Solo Urbano, propõe-se deferimento com parecer vinculativo.'
                                : 'Verificados os elementos instrutórios, constata-se a salvaguarda do canal pedonal de 2,10 metros, propondo-se o deferimento da comunicação prévia mediante a liquidação da taxa regulamentar aplicável ou notificação para confirmação da largura da fachada cadastrada.')}
                            </p>
                          </div>
                        </div>
                      </div>
                    `
                  : html`<div style=${{ padding: '2rem', textAlign: 'center' }}>A carregar processo...</div>`}
              </section>

              <!-- Coluna 3: Painel de Despacho e Livro de Tramitação -->
              <aside class="painel-despacho-atos">
                <div class="painel-titulo-barra">
                  <span>Despacho Técnico</span>
                  <span style=${{ fontSize: '11px', color: 'var(--cmg-texto-suave)' }}>Sónia Martins (8201)</span>
                </div>

                <div class="despacho-formulario">
                  <div class="grupo-campo-despacho">
                    <label class="label-despacho" for="campoFundamento">
                      Fundamentação técnica e jurídica do ato:
                    </label>
                    <textarea
                      id="campoFundamento"
                      class="textarea-despacho"
                      value=${fundamento}
                      onInput=${(e) => setFundamento(e.target.value)}
                      placeholder="Indique os fundamentos de facto e de direito do despacho..."
                    ></textarea>
                  </div>

                  <div class="botoes-atos-administrativos">
                    <button
                      class="btn-ato-autarquico btn-ato-notificar"
                      onClick=${() => executarDespacho('pedir_elementos', isPipAtivo ? 'levantamento_topografico' : 'largura_fachada')}
                    >
                      <span class="btn-ato-titulo">${isPipAtivo ? 'Notificar Requerente para Aperfeiçoamento' : 'Notificar Munícipe para Aperfeiçoamento'}</span>
                      <span class="btn-ato-sub">${isPipAtivo ? 'Solicitar levantamento topográfico georreferenciado (Art. 117.º CPA)' : 'Solicitar confirmação formal da largura da fachada cadastrada (Art. 117.º CPA)'}</span>
                    </button>

                    <button
                      class="btn-ato-autarquico btn-ato-deferir"
                      onClick=${() => executarDespacho('aceitar')}
                    >
                      <span class="btn-ato-titulo">${isPipAtivo ? 'Deferir Pedido de Informação Prévia' : 'Deferir Mera Comunicação Prévia e Emitir Título'}</span>
                      <span class="btn-ato-sub">${isPipAtivo ? `Emitir certidão vinculativa e liquidar taxa regulamentar de ${processoAtivo?.taxa_calculada?.valor ?? 52.50} €` : `Aprovar ocupação e liquidar taxa regulamentar de ${processoAtivo?.taxa_calculada?.valor ?? 75.75} €`}</span>
                    </button>

                    <button
                      class="btn-ato-autarquico btn-ato-indeferir"
                      onClick=${() => executarDespacho('rejeitar')}
                    >
                      <span class="btn-ato-titulo">Indeferir Pedido com Audiência Prévia</span>
                      <span class="btn-ato-sub">Emitir projeto fundamentado de indeferimento (Art. 121.º CPA)</span>
                    </button>
                  </div>

                  ${mensagemSucesso
                    ? html`<div class="notificacao-sucesso-ato">${mensagemSucesso}</div>`
                    : null}

                  <!-- Livro de Tramitação Oficial dos Autos -->
                  <div class="livro-tramitacao-area">
                    <div class="livro-tramitacao-titulo">Livro de Registo de Tramitação</div>
                    <div class="lista-atos-tramitacao">
                      ${(processoAtivo?.historico || []).map(
                        (h, idx) => html`
                          <div key=${idx} class="registo-ato-item">
                            <div class="registo-ato-data">
                              ${new Date(h.ts).toLocaleTimeString('pt-PT')} · ${h.ator === 'pessoa:ines_guimaraes' ? 'Maria Lurdes Gonçalves (Requerente)' : h.ator === 'tecnica:servicos-urbanos' ? 'Eng.ª Sónia Martins (Técnica)' : h.ator}
                            </div>
                            <div class="registo-ato-transicao">
                              ${nomesEstados[h.de] || h.de} → ${nomesEstados[h.para] || h.para}
                            </div>
                            ${h.fundamento
                              ? html`<div class="registo-ato-fundamento">${h.fundamento}</div>`
                              : null}
                          </div>
                        `
                      )}
                    </div>
                  </div>
                </div>
              </aside>
            </main>

            <!-- 4. Rodapé Autárquico Institucional -->
            <footer class="cmg-footer">
              <div class="footer-conteudo">
                <div>
                  <b>Município de Guimarães</b> · Largo Cónego José Maria Gomes, 4804-534 Guimarães · Telefone: 253 421 200 · E-mail: geral@cm-guimaraes.pt
                </div>
                <div>
                  Divisão de Gestão do Espaço Público · Desafio 3.4 (Hack4Guimarães 2035)
                </div>
              </div>
            </footer>
          </div>
        `;
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(ConsolaMunicipalApp));
    </script>
  </body>
</html>
