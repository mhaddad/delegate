# Âncora da demonstração. Não tem bloco próprio no corpus municipal: o que
# se sabe vem da página da Câmara sobre comunicação prévia e da tabela de taxas.
id: ocupacao-espaco-publico-esplanada
versao: 2026-10-18.1
estado: revisto
entidade: Câmara Municipal de Guimarães
competencia: camara
unidade_responsavel: Gabinete de Serviços Urbanos
titulo_oficial: Ocupação do Espaço Público
titulo_simples: Pôr uma esplanada à porta do estabelecimento
sinonimos: [esplanada, mesas na rua, ocupar o passeio, guarda-ventos]
publico: [empresas]
eventos_de_vida: [abrir-negocio]
tipo_procedimento: mera comunicação prévia
condicoes:
  - texto: Ocupar o espaço público contíguo à fachada do estabelecimento.
    fonte: cm-licenciamento-zero
  - texto: Assegurar um corredor para peões com pelo menos 2,00 metros na calçada.
    fonte: cm-licenciamento-zero
documentos:
  - texto: Requerimento de Ocupação de Espaço Público (Modelo OVP-SO) ou Mera Comunicação Prévia
    fonte: cmg-formulario-ovp-so
  - texto: Planta de localização ou fotografia do local cotada com delimitação da área e garantia de corredor de 2,00 m
    fonte: cm-licenciamento-zero
  - texto: Certidão permanente da empresa ou comprovativo de início de atividade do estabelecimento comercial
    fonte: cmg-formulario-ovp-so
  - texto: Apólice de seguro de responsabilidade civil
    fonte: cmg-formulario-ovp-so
taxas:
  descricao: >-
    Taxa apurada em função da área (m²) e do período de ocupação (mensal ou anual),
    calculada nos termos do Regulamento e Tabela de Taxas e Outras Receitas do Município de Guimarães (RTTL).
  valor: null
  fonte: null
  unidade: por m2 e por ano
prazos:
  - texto: Mera comunicação prévia — o início da ocupação é imediato após a submissão e o pagamento da taxa devida
    fonte: cm-licenciamento-zero
canais:
