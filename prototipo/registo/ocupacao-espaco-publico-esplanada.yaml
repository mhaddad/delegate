    fonte: cmg-formulario-ovp-so
dados_minimos: [localizacao, atividade, numero_mesas, area, periodo]
nivel_risco: baixo
escalonamento: Dúvidas sobre localização ou dimensões passam para o Gabinete de Serviços Urbanos
limites: A avaliação técnica local é da Câmara.
