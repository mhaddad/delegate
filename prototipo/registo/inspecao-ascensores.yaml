prazos:
  - texto: Na sequência de reprovação, as anomalias devem ser resolvidas dentro do prazo de 30 dias.
    fonte: cm-ascensores
  - texto: >-
      A inspeção periódica faz-se de dois em dois anos em edifícios comerciais
      ou de serviços abertos ao público, de quatro em quatro anos em edifícios
      mistos e em edifícios habitacionais com mais de 32 fogos ou 8 pisos, e
      de seis em seis anos nos restantes.
    fonte: cm-ascensores
