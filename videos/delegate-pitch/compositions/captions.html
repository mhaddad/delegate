        <div class="cg" id="cg-0"><span>Foi em Guimarães que nasceu Portugal.</span></div>

        <div class="cg" id="cg-2"><span>o terreno que herdou do avô.</span></div>

        <div class="cg" id="cg-60"><span>É ele quem decide.</span></div>
